# profiles/etl.yaml
#
# ET: Legacy (Wolfenstein: Enemy Territory) entity ontology and engine facts. Data only - no
# code reads ET identifiers from anywhere but this file and corpus/.
#
# Two kinds of source, both listed under profile.sources:
#   - the NetRadiant-custom ET gamepack, for entity classnames, keys and spawnflags. The
#     entities: and enums: sections are a mechanical rendering of et_entities.ent; only the
#     `category` of each class is assigned by hand (it is a taxonomy, not gamepack data).
#   - the ET: Legacy source tree, for everything the gamepack does not state: player box,
#     movement constants, gametypes, engine limits, spawn selection, and the files a map
#     ships with. Every such entry cites file:line, relative to the tree's src/ directory.
#
# Unlike the Urban Terror gamepack, this one carries no measuring entities, so there is no
# empirically measured clearance here. A figure that is a literal constant in source, or exact
# arithmetic on such constants, is `verified`. A figure that depends on simulating movement
# (how high a jump reaches, how far a fall hurts) is derived, approximate and `unverified`.
#
# CONFIDENCE SEMANTICS (hard requirement, a validator depends on it):
#   verified    - the fact is literally present in one of the files listed under
#                 profile.sources, or is exact arithmetic on facts that are.
#                 Downstream validators may emit hard failures.
#   unverified  - believed true but NOT present in those files. Never a hard failure.
#
# `description` and `notes` are the gamepack's own wording, whitespace-collapsed. All of it is
# documentation, not validation input.

profile:
  id: etl
  game: "ET: Legacy"
  basegame: etmain
  engine_version: "2.86.2"
  radiant_build: "NetRadiant-custom-20260114"
  extracted: "2026-10-31"
  # Paths for gamepack_* are relative to the NetRadiant-custom install's gamepacks/
  # directory; etlegacy_source paths are relative to the source tree's src/ directory.
  sources:
    - id: gamepack_entities
      path: "et.game/etmain/et_entities.ent"
      radiant_build: "NetRadiant-custom-20260114"
      bytes: 95464
      sha256: "0939cec5d9b3372459e866ca1fe03e0de5362f7ad80be7177dbcbbe14c34102c"
      note: "installed gamepack; authoritative for classnames, keys and spawnflags"
    - id: gamepack_shaderlist
      path: "et.game/etmain/default_shaderlist.txt"
      radiant_build: "NetRadiant-custom-20260114"
      bytes: 1154
      sha256: "65f97654895bce38e495d959296620655423ea119be75c93fc85f4eaa2f68de1"
      note: "shader script list shipped with the gamepack"
    - id: gamepack_gamefile
      path: "games/et.game"
      radiant_build: "NetRadiant-custom-20260114"
      bytes: 779
      sha256: "53d74146d21d50368d4a65ac71d1e870f347aad6c23d60c3f57e2915f11de132"
      note: "editor game descriptor; source for basegame, engine names, asset types, q3map2 game"
    - id: gamepack_build_menu
      path: "et.game/default_build_menu.xml"
      radiant_build: "NetRadiant-custom-20260114"
      bytes: 3254
      note: "the editor's stock q3map2 command lines for this game"
    - id: etlegacy_source
      path: "etlegacy src/ (VERSION.txt: 2.86.2)"
      note: >-
        the engine and mod source. Cited as file:line; re-check the line numbers when this
        profile is re-extracted against a newer release.
    - id: game_common_shader
      path: "etmain/pak0.pk3:scripts/common.shader"
      bytes: 14977
      note: "the base game's common shaders, from an installed ET: Legacy; source for clip shader names"

# Editor/engine facts from games/et.game (verbatim attribute values).
editor:
  confidence: verified
  source: gamepack_gamefile
  type: et
  name: "Wolfenstein: Enemy Territory"
  basegame: etmain
  basegamename: "Wolfenstein: Enemy Territory"
  prefix: ".etwolf"
  engine:
    win32: "ET.exe"
    linux: "et"
  enginepath:
    win32: "C:/Program Files (x86)/Wolfenstein - Enemy Territory/"
    linux: "/usr/local/games/enemy-territory/"
    macos: "/Applications/Wolfenstein ET/"
  note: >-
    The gamepack describes the original game. ET: Legacy installs as etl.exe / etl and
    keeps etmain as its base game; its own mod directory is `legacy`.
  shaderpath: scripts
  archivetypes: [pk3]
  texturetypes: [tga, jpg, png]
  maptypes: [mapq3]
  entityclasstype: [def, xml]
  common_shaders_dir: "common/"
  shader_trigger: "textures/common/trigger"
  # The `-game` value q3map2 is run with. Read by tools/q3map2.py when NRC_Q3MAP2_GAME is unset.
  q3map2_type: et

# The editor's stock compile lines, for reference. tools/q3map2.py has its own presets; these
# record what the gamepack author considered normal for this game.
build_menu:
  confidence: verified
  source: gamepack_build_menu
  bsp: "-meta -mv 1024 -mi 6144"
  vis: "-vis -saveprt"
  light: "-light -fast -samples 2 -filter -external -lightmapsize 256"
  note: >-
    -mv/-mi cap verts and indexes per meta surface; -external -lightmapsize 256 writes
    external 256x256 lightmaps, which every light build in the menu uses.

units:
  system: quake_units
  confidence: verified
  source: etlegacy_source
  note: >-
    The player is a box from playerMins to playerMaxs about its origin, and the origin is 24
    units above the floor. Heights below are measured from the floor.
  player:
    bounding_box:
      width_x: 36
      width_y: 36
      height_stand: 72
      confidence: verified
      source: etlegacy_source
      locus: "game/g_client.c:53-54 (playerMins -18 -18 -24, playerMaxs 18 18 48)"
    height_crouch:
      value: 48
      confidence: verified
      source: etlegacy_source
      locus: >-
        game/g_client.c:3240 crouchMaxZ = maxs[2] - (standViewHeight - crouchViewHeight)
        = 48 - (40 - 16) = 24, so the crouched box spans -24..24
    height_prone:
      value: 40
      confidence: verified
      source: etlegacy_source
      locus: "game/bg_pmove.c:1098 maxs[2] = PRONE_BODYHEIGHT_BBOX (bg_public.h:89, 16), so -24..16"
      note: "the prone body also has a separate legs box behind it; only the main box is recorded"
    eye_height:
      value: 64
      confidence: verified
      source: etlegacy_source
      locus: "bg_public.h:72 DEFAULT_VIEWHEIGHT 40, above an origin 24 units off the floor"

movement:
  confidence: verified
  source: etlegacy_source
  note: >-
    Literal constants from the movement code. ET has no ledge grab or wall jump, so those
    entries are absent rather than zero. It does have prone, which no tool checks yet.
  step_height:
    value: 18
    description: "Max height a player can walk up without needing to jump."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_local.h:51 STEPSIZE"
  headroom_stand:
    value: 72
    description: "Standing player height."
    confidence: verified
    source: etlegacy_source
    locus: "game/g_client.c:53-54"
  headroom_crouch:
    value: 48
    description: "Crouching player height."
    confidence: verified
    source: etlegacy_source
    locus: "game/g_client.c:3240"
  headroom_prone:
    value: 40
    description: "Prone player height (main box only)."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_pmove.c:1098, game/bg_public.h:89"
  eye_height:
    value: 64
    description: "Standing eye height above the floor."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_public.h:72 DEFAULT_VIEWHEIGHT, plus the 24-unit origin offset"
  eye_height_crouch:
    value: 40
    description: "Crouching eye height above the floor."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_public.h:73 CROUCH_VIEWHEIGHT 16, plus 24"
  eye_height_prone:
    value: 16
    description: "Prone eye height above the floor."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_public.h:75 PRONE_VIEWHEIGHT -8, plus 24"
  jump_velocity:
    value: 270
    description: "Upward speed given by a jump, in units per second."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_local.h:53 JUMP_VELOCITY, applied at game/bg_pmove.c:828"
  jump_up_max:
    value_approx: 45.5
    description: >-
      Rise of a standing jump, v^2 / 2g = 270^2 / 1600 = 45.56. Approximate: the real figure
      depends on frame-rate integration and on whether a step-up helps at the top.
    confidence: unverified
    source: etlegacy_source
    locus: "derived from bg_local.h:53 and bg_public.h:55"
  fall_damage:
    confidence: unverified
    source: etlegacy_source
    note: >-
      PM_CrashLand (game/bg_pmove.c:1628) computes delta = v^2 * 0.0001 from the impact speed
      and hurts above 38.75 (bg_pmove.c:1717), kills above 77 (bg_pmove.c:1674). The drops
      below convert those thresholds to a free fall from rest at gravity 800 (h = v^2 / 1600).
      Derived, not measured: frame timing moves them by a few units.
    thresholds:
      - {band: none, max_drop: 242, description: "Largest drop that costs no health (delta 38.75).",
         confidence: unverified, source: etlegacy_source}
      - {band: fatal, min_drop: 481, description: "A drop from this or higher kills outright (delta 77).",
         confidence: unverified, source: etlegacy_source}
  gravity:
    default: 800
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_public.h:55 DEFAULT_GRAVITY; g_gravity default at game/g_cvars.c:434"
  run_speed:
    value: 320
    description: "Default g_speed, in units per second. Not read by any tool yet."
    confidence: verified
    source: etlegacy_source
    locus: "game/g_cvars.c:433"

# ---------------------------------------------------------------------------
# gametypes
# ---------------------------------------------------------------------------
#
# ET gametypes are a server setting (g_gametype), not an entity filter: no entity in the
# gamepack carries a gametype key, so there is no gametype_key_syntax section and no
# per-gametype entity rule. Which gametypes a map supports is declared by the `type` key of its
# .arena file (see packaging.arena).

gametypes:
  - {id: 0, name: SP, label: "Single Player", team_mode: false, obsolete: true, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:453"}
  - {id: 1, name: COOP, label: "Cooperative", team_mode: false, obsolete: true, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:454"}
  - {id: 2, name: OBJ, label: "Objective", team_mode: true, arena_type: wolfmp, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:455 GT_WOLF"}
  - {id: 3, name: SW, label: "Stopwatch", team_mode: true, arena_type: wolfsw, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:456 GT_WOLF_STOPWATCH"}
  - {id: 4, name: CAMPAIGN, label: "Campaign", team_mode: true, arena_type: wolfmp, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:457 GT_WOLF_CAMPAIGN; the default, game/g_cvars.c:376"}
  - {id: 5, name: LMS, label: "Last Man Standing", team_mode: true, arena_type: wolflms, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:458 GT_WOLF_LMS"}
  - {id: 6, name: MAPVOTE, label: "Map Voting", team_mode: true, arena_type: wolfmp, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:459 GT_WOLF_MAPVOTE"}

# Sides. ET calls the teams Axis and Allies; the spawn classnames still say red and blue.
teams:
  confidence: verified
  source: etlegacy_source
  locus: "game/g_team.c:469 (TEAM_AXIS -> team_CTF_redspawn), :473 (TEAM_ALLIES -> team_CTF_bluespawn)"
  sides:
    - {label: red, name: Axis}
    - {label: blue, name: Allies}
  note: >-
    No ET spawn carries a team key. The team is in the classname for spawns, and in
    spawnflags for the classes below. func_constructible (AXIS/ALLIED_CONSTRUCTIBLE, 4/8) and
    team_WOLF_checkpoint (AXIS/ALLIED_ONLY, 4/8) are left out: their flags say who may build
    or capture, not who owns the thing.
  # Team by spawnflag. Read by Roles.team_of; the first flag set wins.
  spawnflags:
    team_WOLF_objective:     # DEFAULT_AXIS / DEFAULT_ALLIES, g_team.c:952-958
      - {flag: 1, label: red}
      - {flag: 2, label: blue}
    trigger_objective_info:  # AXIS_OBJECTIVE / ALLIED_OBJECTIVE: who owns it, gamepack
      - {flag: 1, label: red}
      - {flag: 2, label: blue}
    misc_commandmap_marker:  # ONLY_AXIS / ONLY_ALLIED, gamepack
      - {flag: 1, label: red}
      - {flag: 2, label: blue}

# What a category cannot say. Read by analysis.roles.
roles:
  # An objective volume. Categorized `trigger` so its brushes are not collision, but it is
  # where the fighting is, so balance_report measures to it (from its brushes' centre).
  objectives_also: [trigger_objective_info]
  # No group key: a team spawns at its active spawns nearest the selected marker
  # (game/g_team.c:455 onward), so spawns are grouped by their nearest marker.
  spawn_groups:
    nearest: team_WOLF_objective
    label_key: description

# ---------------------------------------------------------------------------
# ENUMS and ENTITIES
# Every classname defined in et_entities.ent (120), rendered mechanically, then the 40 classes
# the engine spawns that the gamepack omits. `kind`: point = point entity (editor box given);
# brush = owns brushes. Categories are this profile's taxonomy: `objective` covers only point
# and solid objectives - trigger_objective_info stays `trigger` so its volume is not mistaken
# for collision, and func_explosive stays `breakable` (see focus:).
# ---------------------------------------------------------------------------

enums:
  leakType:
    confidence: verified
    source: gamepack_entities
    items:
      - {label: "oil", value: "1"}
      - {label: "water", value: "2"}
      - {label: "steam", value: "3"}
  shardType:
    confidence: verified
    source: gamepack_entities
    items:
      - {label: "glass", value: "0"}
      - {label: "wood", value: "1"}
      - {label: "metal", value: "2"}
      - {label: "ceramic", value: "3"}

entities:
  - classname: _decal
    kind: brush
    category: compiler
    confidence: verified
    source: gamepack_entities
    description: "Compiler-only entity that specifies a decal to be projected. Should contain 1 or more patch meshes (curves) and target an info_null entity. The distance between the center of the _decal entity and the target is the axis and distance of projection."
    keys:
      - {name: target, type: target, confidence: verified, source: gamepack_entities, editor_label: "Target", description: "the name of the entity targetted at for projection"}
    spawnflags: []
  - classname: _skybox
    kind: point
    category: compiler
    confidence: verified
    source: gamepack_entities
    editor_box: "-4 -4 -4 4 4 4"   # xmin ymin zmin xmax ymax zmax
    description: "Compiler-only entity that specifies the origin of a skybox (a wholly contained, seperate area of the map), similar to the props_skyportal skies. When compiled with Q3Map2, the skybox surfaces will be visible from any place where sky is normally visible. It will cast shadows on the normal parts of the map, and can be used with cloud layers and other effects. Unlike props_skyportal, the player cannot elect to switch it off with r_fastsky."
    keys:
      - {name: angle, type: angle, confidence: verified, source: gamepack_entities, editor_label: "Yaw Angle", description: "rotation angle of the sky surfaces."}
      - {name: angles, type: angles3, confidence: verified, source: gamepack_entities, editor_label: "Pitch Yaw Roll", description: "Individual control of PITCH, YAW, and ROLL (default 0 0 0)."}
      - {name: _scale, type: float, confidence: verified, source: gamepack_entities, editor_label: "Scale", description: "scaling factor (default 64), good values are between 50 and 300, depending on the map."}
    spawnflags: []
  - classname: corona
    kind: point
    category: light
    confidence: verified
    source: gamepack_entities
    editor_box: "-4 -4 -4 4 4 4"   # xmin ymin zmin xmax ymax zmax
    description: "Use color picker to set color or key \"color\". Values are 0.0-1.0 for each color (RGB)."
    keys:
      - {name: scale, type: float, confidence: verified, source: gamepack_entities, editor_label: "Scale", description: "Designates a multiplier to the default size. (so 2.0 is 2xdefault size, 0.5 is half)"}
      - {name: color, type: color3, confidence: verified, source: gamepack_entities, editor_label: "Corona color", description: "Weighted RGB value of light color"}
    spawnflags:
      - {name: START_OFF, bit: 0, value: 1, confidence: verified, source: gamepack_entities, editor_label: "Start off", description: "Starts non-visible"}
  - classname: dlight
    kind: point
    category: light
    confidence: verified
    source: gamepack_entities
    editor_box: "-12 -12 -12 12 12 12"   # xmin ymin zmin xmax ymax zmax
    description: "Stylestring characters run at 10 cps in the game. (meaning the alphabet, at 24 characters, would take 2.4 seconds to cycle) Use color picker to set color or key \"color\". values are 0.0-1.0 for each color (rgb). styles: 1 - \"mmnmmommommnonmmonqnmmo\" 2 - \"abcdefghijklmnopqrstuvwxyzyxwvutsrqponmlkjihgfedcba\" 3 - \"mmmmmaaaaammmmmaaaaaabcdefgabcdefg\" 4 - \"ma\" 5 - \"jklmnopqrstuvwxyzyxwvutsrqponmlkj\" 6 - \"nmonqnmomnmomomono\" 7 - \"mmmaaaabcdefgmmmmaaaammmaamm\" 8 - \"aaaaaaaazzzzzzzz\" 9 - \"mmamammmmammamamaaamammma\" 10 - \"abcdefghijklmnopqrrqponmlkjihgfedcba\" 11 - \"mmnommomhkmmomnonmmonqnmmo\" 12 - \"kmamaamakmmmaakmamakmakmmmma\" 13 - \"kmmmakakmmaaamammamkmamakmmmma\" 14 - \"mmnnoonnmmmmmmmmmnmmmmnonmmmmmmm\" 15 - \"mmmmnonmmmmnmmmmmnonmmmmmnmmmmmmm\" 16 - \"zzzzzzzzaaaaaaaa\" 17 - \"zzzzzzzzaaaaaaaaaaaaaaaa\" 18 - \"aaaaaaaazzzzzzzzaaaaaaaa\" 19 - \"aaaaaaaaaaaaaaaazzzzzzzz\""
    keys:
      - {name: style, type: integer, confidence: verified, source: gamepack_entities, editor_label: "Style", description: "Value is an int from 1-19 that contains a pre-defined 'flicker' string."}
      - {name: stylestring, type: string, confidence: verified, source: gamepack_entities, editor_label: "Style string", description: "Set your own 'flicker' string, e.g. \"klmnmlk\". NOTE: this should be all lowercase."}
      - {name: offset, type: integer, confidence: verified, source: gamepack_entities, editor_label: "Offset", description: "Change the initial index in a style string. So val of 3 in the above example would start this light at 'N'. (used to get dlights using the same style out of sync)."}
      - {name: atten, type: integer, confidence: verified, source: gamepack_entities, editor_label: "Attenuation", description: "Offset from the alpha values of the stylestring. stylestring of \"ddeeffzz\" with an atten of -1 would result in \"ccddeeyy\""}
      - {name: shader, type: string, confidence: verified, source: gamepack_entities, editor_label: "Shader", description: "Name of shader to apply"}
      - {name: sound, type: sound, confidence: verified, source: gamepack_entities, editor_label: "Sound", description: "Sound to loop every cycle (this actually just plays the sound at the beginning of each cycle)"}
    spawnflags:
      - {name: FORCEACTIVE, bit: 0, value: 1, confidence: verified, source: gamepack_entities, editor_label: "Force active", description: "Toggle makes sure this light stays alive in a map even if the user has r_dynamiclight set to 0."}
      - {name: STARTOFF, bit: 1, value: 2, confidence: verified, source: gamepack_entities, editor_label: "Start off", description: "The dlight doesn't spawn in until ent is triggered"}
      - {name: ONETIME, bit: 2, value: 4, confidence: verified, source: gamepack_entities, editor_label: "One time", description: "When the dlight is triggered, it will play through it's cycle once, then shut down until triggered again"}
  - classname: func_bobbing
    kind: brush
    category: mover
    confidence: verified
    source: gamepack_entities
    description: "Normally bobs on the Z axis"
    keys:
      - {name: model2, type: model, confidence: verified, source: gamepack_entities, editor_label: "Model File", description: "Path/name of optional model to include"}
      - {name: height, type: float, confidence: verified, source: gamepack_entities, editor_label: "Vertical Travel", description: "Sets the amount of travel of the oscillation movement (default 32)."}
      - {name: speed, type: float, confidence: verified, source: gamepack_entities, editor_label: "Bob Cycle Time", description: "Amount of time in seconds for one complete oscillation cycle (default 4)."}
      - {name: phase, type: float, confidence: verified, source: gamepack_entities, editor_label: "Bob Cycle Phase", description: "Sets the start offset of the oscillation cycle. Values must be 0 < phase < 1. Any integer phase value is the same as no offset (default 0)."}
      - {name: dmg, type: integer, confidence: verified, source: gamepack_entities, editor_label: "Damage", description: "Damage to inflict when blocked (2 default)"}
      - {name: light, type: float, confidence: verified, source: gamepack_entities, editor_label: "Model Light Intensity", description: "constantLight radius of .md3 model included with entity. Has no effect on the entity's brushes (default 0)."}
      - {name: color, type: color3, confidence: verified, source: gamepack_entities, editor_label: "Model Light Color", description: "constantLight color of .md3 model included with entity. Has no effect on the entity's brushes (default 1 1 1)."}
      - {name: _targetname, type: targetname, confidence: verified, source: gamepack_entities, editor_label: "Target Name", description: "Used to attach a misc_model entity to this entity."}
      - {name: _lightmapscale, type: float, confidence: verified, source: gamepack_entities, editor_label: "Lightmap Scale", description: "Floating point value scaling the resolution of lightmaps on brushes/patches in this entity (default 1.0)."}
      - {name: _castshadows, type: integer, confidence: verified, source: gamepack_entities, editor_label: "Shadow Caster Level", description: "Allows per-entity control over shadow casting. Defaults to 0 on entities, 1 on world. 0 = no shadow casting. 1 = cast shadows on world. > 1 = cast shadows on entities with _rs (or _receiveshadows) with the corresponding value, AND world. Negative values imply same, but DO NOT cast shadows on world."}
      - {name: _receiveshadows, type: integer, confidence: verified, source: gamepack_entities, editor_label: "Shadow Reciever Level", description: "Allows per-entity control over shadow reception. Defaults to 1 on everything (world shadows). 0 = receives NO shadows. > 1 = receive shadows only from corresponding keyed entities (see above) and world. < 1 = receive shadows ONLY from corresponding keyed entities."}
      - {name: _celshader, type: texture, confidence: verified, source: gamepack_entities, editor_label: "Cel Shader", description: "Sets the cel shader used for this geometry. Note: omit the \"textures/\" prefix."}
    spawnflags:
      - {name: X_AXIS, bit: 0, value: 1, confidence: verified, source: gamepack_entities, editor_label: "X Axis", description: "entity will bob along the X axis."}
      - {name: Y_AXIS, bit: 1, value: 2, confidence: verified, source: gamepack_entities, editor_label: "Y Axis", description: "entity will bob along the Y axis."}
  - classname: func_brushmodel
    kind: brush
    category: mover
    confidence: verified
    source: gamepack_entities
    description: "A brushmodel that gets deleted on the fourth frame. We use this to hijack it's brushmodel in func_constructible entities that are based around staged construction."
    keys: []   # the gamepack entry declares no keys
    spawnflags: []
  - classname: func_constructible
    kind: brush
    category: objective
    confidence: verified
    source: gamepack_entities
    description: "A constructible object that functions as target for engineers."
    keys:
      - {name: track, type: string, confidence: verified, source: gamepack_entities, editor_label: "Track", description: "Functions as a group name. All entities with the same 'track' as the func_constructible will be constructed at the same time."}
      - {name: constages, type: string, confidence: verified, source: gamepack_entities, editor_label: "Construction stages", description: "List of target func_brushmodel entities (up to 3) that make up the construction stages (example: \"stage1;stage2;\")"}
      - {name: desstages, type: string, confidence: verified, source: gamepack_entities, editor_label: "Destruction stages", description: "List of target func_brushmodel entities (up to 3) that make up the destruction stages (example: \"desstage1;desstage2;\")"}
    spawnflags:
      - {name: START_BUILT, bit: 0, value: 1, confidence: verified, source: gamepack_entities, editor_label: "Start built", description: "Starts built"}
      - {name: INVULNERABLE, bit: 1, value: 2, confidence: verified, source: gamepack_entities, editor_label: "Invulnerable", description: "Indestructible"}
      - {name: AXIS_CONSTRUCTIBLE, bit: 2, value: 4, confidence: verified, source: gamepack_entities, editor_label: "Axis constructible", description: "Axis can build this, if not invulnerable Allies can damage it"}
      - {name: ALLIED_CONSTRUCTIBLE, bit: 3, value: 8, confidence: verified, source: gamepack_entities, editor_label: "Allied constructible", description: "Allies can build this, if not invulnerable Axis can damage it"}
  - classname: func_debris
    kind: brush
    category: breakable
    confidence: verified
    source: gamepack_entities
