# ---------------------------------------------------------------------------
# rules — declarative validation, evaluated by nrc_mcp.rules
# ---------------------------------------------------------------------------
#
# The map script is checked separately, from `mapscript:` below. Not expressed yet: spawn
# spacing, which needs spawns grouped by nearest marker inside the rule engine.

rules:
  # The gamepack says a map MUST have exactly one, but the engine enforces only the upper
  # bound: a second one stops the game, a missing one is a printed complaint.
  - id: ETL_SCRIPT_MULTIPLAYER_AT_MOST_ONE
    check: count_max
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_script.c:1410-1412 (G_Error \"multiple script_multiplayers found\")"
    message: >-
      found {found} script_multiplayer entities; the game stops at load with "multiple
      script_multiplayers found" above {expected}
    fix_hint: "keep exactly one script_multiplayer"
    params:
      classname: script_multiplayer
      count: 1

  - id: ETL_SCRIPT_MULTIPLAYER_REQUIRED
    check: count_min
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_main.c:1858-1861 (prints \"No 'script_multiplayer' found in map\" and carries on); gamepack et_entities.ent: script_multiplayer notes"
    message: >-
      found {found} script_multiplayer entities; the map loads, but its game_manager block never
      runs, so no respawn times, autospawns or win conditions are set
    fix_hint: "add one script_multiplayer; it always runs the game_manager block"
    params:
      classname: script_multiplayer
      count: 1

  - id: ETL_SPAWN_REGION_REQUIRED
    check: count_min
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_team.c:496-537 (G_Error \"No spawnpoints found\" once an active spawn is chosen)"
    message: >-
      the map has active team spawns but {found} team_WOLF_objective spawn markers; the game
      stops with "No spawnpoints found" the first time a team spawns
    fix_hint: "add a team_WOLF_objective near each spawn area, with DEFAULT_AXIS or DEFAULT_ALLIES set"
    # Only an active spawn reaches the check; with none active the game falls back first.
    applies_when:
      flag_present:
        - {classname: team_CTF_redspawn, flag: 2}
        - {classname: team_CTF_bluespawn, flag: 2}
    params:
      classname: team_WOLF_objective
      count: 1

  - id: ETL_SPAWN_REGION_LIMIT
    check: count_max
    severity: error
    confidence: verified
    rule_source: "etlegacy qcommon/q_shared.h:1262 MAX_MULTI_SPAWNTARGETS, game/g_team.c:915"
    message: >-
      found {found} team_WOLF_objective spawn markers; the game stops at load with
      "exceeded MAX_MULTI_SPAWNTARGETS" above {expected}
    fix_hint: "merge spawn regions until there are at most 16 markers"
    params:
      classname: team_WOLF_objective
      count: 16

  - id: ETL_SPECTATOR_POINT_REQUIRED
    check: require_any
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_client.c:3057-3059 (spectators spawn at the intermission point), game/g_main.c:2464-2466 (no info_player_intermission falls back to SelectSpawnPoint), game/g_client.c:337-340 (G_Error \"Couldn't find a spawn point\" without an info_player_deathmatch)"
    message: >-
      the map has no intermission or deathmatch point ({expected}); every client joins as a
      spectator, and the first one to connect stops the server with "Couldn't find a spawn point"
    fix_hint: "add an info_player_intermission looking over the map with spawnflags 3, covering both winning teams as well as spectators; a neutral camera alone cannot cover round end"
    # Team spawns do not count: a spectator never uses them. info_player_start spawns as
    # info_player_deathmatch (g_client.c:203-207).
    params:
      classnames: [info_player_intermission, info_player_deathmatch, info_player_start]

  # Neutral cameras are searched only before intermissiontime is set. Round end needs a
  # winner-matching bit, even when a neutral camera let spectators join successfully. Either
  # fallback class avoids the fatal SelectSpawnPoint path (start is renamed at spawn).
  - id: ETL_INTERMISSION_AXIS_POINT_REQUIRED
    check: flag_count_min
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_main.c:2414-2468 FindIntermissionPoint (neutral cameras only before intermission, winner flag 1); game/g_client.c:203-207 (start becomes deathmatch), :317-340 (fatal without fallback)"
    message: >-
      no info_player_intermission has the Axis winner flag ({flag}) and no deathmatch/start
      fallback exists; if Axis wins, round end stops the server with "Couldn't find a spawn point"
    fix_hint: "add an Axis camera with spawnflags 1, or use spawnflags 3 on a shared winner camera"
    applies_when:
      classname_absent: [info_player_deathmatch, info_player_start]
    params:
      classname: info_player_intermission
      flag: 1
      count: 1

  - id: ETL_INTERMISSION_ALLIES_POINT_REQUIRED
    check: flag_count_min
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_main.c:2414-2468 FindIntermissionPoint (neutral cameras only before intermission, winner flag 2); game/g_client.c:203-207 (start becomes deathmatch), :317-340 (fatal without fallback)"
    message: >-
      no info_player_intermission has the Allies winner flag ({flag}) and no deathmatch/start
      fallback exists; if Allies wins, round end stops the server with "Couldn't find a spawn point"
    fix_hint: "add an Allied camera with spawnflags 2, or use spawnflags 3 on a shared winner camera"
    applies_when:
      classname_absent: [info_player_deathmatch, info_player_start]
    params:
      classname: info_player_intermission
      flag: 2
      count: 1

  - id: ETL_OBJECTIVE_INFO_TRACK_REQUIRED
    check: key_required
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1818-1820; gamepack: track \"Mandatory\""
    message: >-
      {found} {classname} entity/entities have no {key} key; the game stops at load with
      "'trigger_objective_info' does not have a 'track'"
    fix_hint: "give each trigger_objective_info a track, the name shown after \"You are near\""
    params:
      classname: trigger_objective_info
      key: track

  - id: ETL_SPAWN_REGION_DESCRIPTION
    check: key_required
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_team.c:942 (default description)"
    message: >-
      {found} {classname} entity/entities have no {key} key; the limbo spawn list will show
      "WARNING: No objective description set" for them
    fix_hint: "set description to the name players should see in the spawn list"
    params:
      classname: team_WOLF_objective
      key: description

  - id: ETL_TEAM_SPAWN_ACTIVE_AXIS
    check: flag_count_min
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_team.c:496 (skips spawns without STARTACTIVE), :532 (fallback)"
    message: >-
      none of the {of} team_CTF_redspawn entities has STARTACTIVE (spawnflag {flag}); until a
      script or checkpoint enables one, every Axis player spawns at whichever comes first in
      the map, active or not
    fix_hint: "set STARTACTIVE on the Axis spawns that should be live at the start"
    applies_when:
      classname_present: team_CTF_redspawn
    params:
      classname: team_CTF_redspawn
      flag: 2
      count: 1

  - id: ETL_TEAM_SPAWN_ACTIVE_ALLIES
    check: flag_count_min
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_team.c:496 (skips spawns without STARTACTIVE), :532 (fallback)"
    message: >-
      none of the {of} team_CTF_bluespawn entities has STARTACTIVE (spawnflag {flag}); until a
      script or checkpoint enables one, every Allied player spawns at whichever comes first in
      the map, active or not
    fix_hint: "set STARTACTIVE on the Allied spawns that should be live at the start"
    applies_when:
      classname_present: team_CTF_bluespawn
    params:
      classname: team_CTF_bluespawn
      flag: 2
      count: 1

  - id: ETL_OBJECTIVE_INFO_OVERRIDE_TEXT
    check: flag_requires_key
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1800, :1823-1828; both keys fill it, game/g_spawn.c:216, :226"
    message: >-
      {found} trigger_objective_info entity/entities set MESSAGE_OVERRIDE (spawnflag {flag})
      without a {key} key; the game stops at load with "has override flag set but no
      override text"
    fix_hint: "set override to the override text, or clear spawnflag 4"
    params:
      classname: trigger_objective_info
      flag: 4
      keys: [override, spawnitem]

  - id: ETL_TARGETS_RESOLVE
    check: targets_resolve
    severity: warning
    confidence: verified
    rule_source: >-
      etlegacy game/g_utils.c:594 (G_PickTarget warns "target not found"); construction
      stages are looked up by targetname at game/g_mover.c:5378 and :5415
    message: >-
      {found} name reference(s) name no entity's targetname ({detail}); nothing happens when
      they fire
    fix_hint: "fix the spelling, or give the intended entity that targetname"
    params:
      keys: [target]
      list_keys: [constages, desstages]
      separator: ";"
      # Its target is a script event label, checked by mapscript.entity_events instead.
      # An objective trigger's missing target stops the game: ETL_OBJECTIVE_INFO_TARGET.
      # A path point's target is looked up among path points: ETL_SPLINE_TARGET_CLASS.
      exclude_classnames: [target_script_trigger, trigger_objective_info, info_train_spline_main]

  # --- objectives: each error below stops the game at load (G_Error), checked in etlded ---

  - id: ETL_OBJECTIVE_INFO_TARGET
    check: targets_resolve
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1612-1619 (Think_SetupObjectiveInfo: G_Error \"has a missing target\")"
    message: >-
      {found} trigger_objective_info target(s) name no entity ({detail}); the game stops a few
      frames after load with "has a missing target"
    fix_hint: "give the objective entity that targetname, or fix the trigger's target"
    params:
      classname: trigger_objective_info
      keys: [target]

  - id: ETL_OBJECTIVE_INFO_LIMIT
    check: count_max
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1876-1879, MAX_OID_TRIGGERS game/bg_public.h:230"
    message: >-
      found {found} trigger_objective_info entities; the game stops at load above {expected}
    fix_hint: "merge objectives until there are at most 18 objective triggers"
    params:
      classname: trigger_objective_info
      count: 18

  - id: ETL_CONSTRUCTIBLE_TEAM
    check: flags_any
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_mover.c:5618-5629 (G_Error \"does not have a team that can build it\")"
    message: >-
      {found} func_constructible(s) set neither AXIS_CONSTRUCTIBLE (4) nor ALLIED_CONSTRUCTIBLE
      (8); the game stops at load
    fix_hint: "set spawnflag 4 or 8 for the team that builds it"
    params:
      classname: func_constructible
      flags: [4, 8]

  - id: ETL_CONSTRUCTIBLE_PARENT
    check: targeted_by
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_mover.c:5536-5553 (G_Error \"missing parent trigger_objective_info\")"
    message: >-
      {found} func_constructible(s) start built and are not invulnerable, but no
      trigger_objective_info targets them; the game stops at load
    fix_hint: "add a trigger_objective_info whose target is the constructible's targetname"
    params:
      classname: func_constructible
      when_flags_all: [1]
      when_flags_none: [2]
      by_classname: trigger_objective_info
      by_key: target

  - id: ETL_CONSTRUCTIBLE_STAGE_CLASS
    check: list_targets
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_mover.c:5378-5385 and :5415-5422 (G_Error \"entry doesn't target a 'func_brushmodel'\")"
    message: >-
      construction stage entries name something other than a func_brushmodel ({detail}); the
      game stops at load
    fix_hint: "make each stage a func_brushmodel with that targetname"
    params:
      classname: func_constructible
      keys: [constages, desstages]
      separator: ";"
      target_classes: [func_brushmodel]

  - id: ETL_CONSTRUCTIBLE_STAGE_COUNTS
    check: list_counts_match
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_mover.c:5434-5437 (G_Error \"has %i entries in the desstages and %i targets in the constages key\")"
    message: >-
      constages and desstages list different numbers of stages ({detail}); the game stops at load
    fix_hint: "give desstages exactly as many entries as constages"
    params:
      classname: func_constructible
      keys: [constages, desstages]
      separator: ";"

  - id: ETL_CONSTRUCTIBLE_STAGE_TERMINATOR
    check: key_pattern
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_mover.c:5366-5392 (an entry counts only when a ';' ends it)"
    message: >-
      a stage list does not end with ';' ({detail}); its last entry is silently ignored
    fix_hint: "end every entry with ';', as in \"stage1;stage2;\""
    params:
      classname: func_constructible
      key: constages
      pattern: "(?:[^;]+;)*"

  - id: ETL_CONSTRUCTIBLE_DESSTAGE_TERMINATOR
    check: key_pattern
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_mover.c:5400-5430 (an entry counts only when a ';' ends it)"
    message: >-
      a stage list does not end with ';' ({detail}); its last entry is silently ignored
    fix_hint: "end every entry with ';'"
    params:
      classname: func_constructible
      key: desstages
      pattern: "(?:[^;]+;)*"

  # --- escort vehicles: script movers and the spline paths they follow ---

  - id: ETL_SCRIPT_MOVER_SCRIPTNAME
    check: key_required
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_script.c:1132-1135 (G_Error \"must have a scriptname\")"
    message: "{found} script_mover(s) have no scriptname; the game stops at load"
    fix_hint: "give the script_mover a scriptname and a block for it in the map script"
    params:
      classname: script_mover
      key: scriptname

  - id: ETL_SPLINE_POINT_TARGETNAME
    check: key_required
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_mover.c:3141-3146 (freed with only a console message)"
    message: >-
      {found} {classname}(s) have no targetname; the game drops them, so nothing can follow
      or reach them
    fix_hint: "name every path point; path_place does"
    params:
      classname: info_train_spline_main
      key: targetname

  - id: ETL_SPLINE_CONTROL_TARGETNAME
    check: key_required
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_spawn.c:528 and game/g_mover.c:3108-3113 (spawned as path_corner_2, freed without a targetname)"
    message: "{found} {classname}(s) have no targetname; the game drops them and no curve uses them"
    fix_hint: "name the control point and list that name in a path point's control key"
    params:
      classname: info_train_spline_control
      key: targetname

  - id: ETL_SPLINE_TARGET_CLASS
    check: targets_resolve
    severity: warning
    confidence: verified
    rule_source: >-
      etlegacy game/bg_misc.c:4044-4050 (a spline's target is looked up among spline points only;
      a miss prints "Cant find target point" and leaves the segment without a length or an end)
    message: >-
      {found} path point target(s) name no info_train_spline_main ({detail}); a mover sent
      along that segment does not travel it
    fix_hint: "target the next info_train_spline_main, or leave the last point without a target"
    params:
      classname: info_train_spline_main
      keys: [target]
      target_classes: [info_train_spline_main]
      case_sensitive: false

  - id: ETL_SPLINE_CONTROL_CLASS
    check: targets_resolve
    severity: warning
    confidence: verified
    rule_source: >-
      etlegacy game/bg_misc.c:4026-4041 (controls are looked up among path corners, which
      info_train_spline_control and path_corner_2 make; a miss prints "Cant find control point"
      and the curve ignores it)
    message: "{found} spline control(s) name no control point ({detail}); the segment is not curved by them"
    fix_hint: "name an info_train_spline_control (path_place makes them from `controls`)"
    params:
      classname: info_train_spline_main
      keys: [control, control2, control3, control4]
      target_classes: [info_train_spline_control, path_corner_2]
      case_sensitive: false

  - id: ETL_SPLINE_CONTROL_LIMIT
    check: key_forbidden
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_mover.c:3160-3170 and game/bg_misc.c:3961-3966 (MAX_SPLINE_CONTROLS 4, bg_public.h:2723; Com_Error)"
    message: >-
      {found} path point(s) set control through control4 and also {key} ({detail}); the game
      stops at load with "MAX SPLINE CONTROLS (4) hit"
    fix_hint: "use at most four control points per segment, or add a path point"
    params:
      classname: info_train_spline_main
      key: control5
      when_keys: [control, control2, control3, control4]

  - id: ETL_SPLINE_POINT_LIMIT
    check: count_max
    severity: error
    confidence: verified
    rule_source: "etlegacy game/bg_misc.c:3934-3937 (Com_Error \"MAX SPLINES (512) hit\"; MAX_SPLINE_PATHS bg_public.h:2722)"
    message: "found {found} info_train_spline_main entities; the game stops at load above {expected}"
    fix_hint: "use fewer, longer path segments (control points curve them)"
    params:
      classname: info_train_spline_main
      count: 512

  # --- carried objectives: team_CTF_redflag / blueflag and their delivery triggers ---

  - id: ETL_CARRY_TARGETNAME
    check: key_forbidden
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_items.c:1040-1047 (an item with a targetname spawns hidden and untouchable)"
    message: >-
      {found} carried objective(s) have a {key} ({detail}); the item is never shown and cannot
      be picked up
    fix_hint: "remove the targetname; scripts reach the item by its scriptname"
    params:
      classnames: [team_CTF_redflag, team_CTF_blueflag]
      key: targetname

  - id: ETL_CARRY_MODEL
    check: key_required
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/bg_misc.c:2362-2410 (these items have no world model), game/g_items.c:991-994,1091-1094 (model is drawn)"
    message: "{found} carried objective(s) have no model; the item lies there invisible"
    fix_hint: "set model, e.g. models/multiplayer/secretdocs/secretdocs.md3"
    params:
      classnames: [team_CTF_redflag, team_CTF_blueflag]
      key: model

  - id: ETL_FLAGONLY_TEAM
    check: flags_any
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1256,1291,1343,1373 (fires only for RED_FLAG 1 / BLUE_FLAG 2 carriers)"
    message: >-
      {found} delivery trigger(s) set neither RED_FLAG (1) nor BLUE_FLAG (2); nothing is ever
      delivered there
    fix_hint: "set spawnflag 1 for a team_CTF_redflag item, 2 for a team_CTF_blueflag item"
    params:
      classnames: [trigger_flagonly, trigger_flagonly_multiple]
      flags: [1, 2]

  - id: ETL_FLAGONLY_SCRIPTNAME
    check: key_required
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1268-1272,1352-1356 (delivery runs death in the trigger's own script block, then the item's trigger captured)"
    message: >-
      {found} delivery trigger(s) have no scriptname; a delivery runs no death event, so no
      objective completes
    fix_hint: "give the trigger a scriptname and a death event (objective_place steal does both)"
    params:
      classnames: [trigger_flagonly, trigger_flagonly_multiple]
      key: scriptname

  - id: ETL_CARRY_DELIVERY_RED
    check: flag_count_min
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1256,1343 (only a RED_FLAG trigger takes a team_CTF_redflag from its carrier)"
    applies_when: {classname_present: team_CTF_redflag}
    message: >-
      a team_CTF_redflag can be stolen but no delivery trigger has RED_FLAG (1) set, so it can
      never be delivered
    fix_hint: "add a trigger_flagonly_multiple with spawnflags 1 where it is to be delivered"
    params:
      classnames: [trigger_flagonly, trigger_flagonly_multiple]
      flag: 1
      count: 1

  - id: ETL_CARRY_DELIVERY_BLUE
    check: flag_count_min
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1291,1373 (only a BLUE_FLAG trigger takes a team_CTF_blueflag from its carrier)"
    applies_when: {classname_present: team_CTF_blueflag}
    message: >-
      a team_CTF_blueflag can be stolen but no delivery trigger has BLUE_FLAG (2) set, so it
      can never be delivered
    fix_hint: "add a trigger_flagonly_multiple with spawnflags 2 where it is to be delivered"
    params:
      classnames: [trigger_flagonly, trigger_flagonly_multiple]
      flag: 2
      count: 1

  - id: ETL_CHECKPOINT_SCRIPTNAME
    check: key_required
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_team.c:1417-1420 (G_Error for a checkpoint without a scriptname)"
    message: >-
      {found} team_WOLF_checkpoint(s) have no scriptname; the game stops at load
    fix_hint: "give the checkpoint a scriptname and a block for its trigger events"
    params:
      classname: team_WOLF_checkpoint
      key: scriptname

  # --- command posts: one trigger, one func_constructible per team under one targetname ---

  - id: ETL_OBJECTIVE_INFO_SECOND_TARGET_CLASS
    check: second_target
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1680-1698 (G_Error \"targets multiple entities ... the second one isn't a 'func_constructible'\")"
    message: >-
      a trigger_objective_info targets a func_constructible, and its target names something
      else too ({detail}); the game stops a few frames after load
    fix_hint: "give the other entity its own targetname; only a second func_constructible may share it"
    params:
      classname: trigger_objective_info
      key: target
      first_classes: [func_constructible]
      second_classes: [func_constructible]

  - id: ETL_OBJECTIVE_INFO_CONSTRUCTIBLE_PAIR_TEAMS
    check: second_target
    severity: error
    confidence: verified
    rule_source: "etlegacy game/g_trigger.c:1689-1703 (a constructible's team is AXIS_CONSTRUCTIBLE, else Allies; G_Error \"constructible by the same team\")"
    message: >-
      a trigger_objective_info targets two func_constructibles that the same team builds
      ({detail}); the game stops a few frames after load
    fix_hint: "set AXIS_CONSTRUCTIBLE (4) on one and ALLIED_CONSTRUCTIBLE (8), without 4, on the other"
    params:
      classname: trigger_objective_info
      key: target
      first_classes: [func_constructible]
      second_classes: [func_constructible]
      distinct_flags: [4, 8]

  # --- checkpoints (spawn flags) and the spawn regions they hand over ---

  - id: ETL_CHECKPOINT_TEAM_ONLY_IGNORED
    check: forbid
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_team.c:1463-1476 (without SPAWNPOINT the flag uses checkpoint_touch, :1135-1210, which never reads AXIS_ONLY / ALLIED_ONLY; only checkpoint_spawntouch does, :1247-1300)"
    message: >-
      {found} team_WOLF_checkpoint(s) set AXIS_ONLY (4) or ALLIED_ONLY (8) without SPAWNPOINT
      (1); the bit is ignored and either team can raise the flag
    fix_hint: "add SPAWNPOINT (1), or clear the team bit"
    params:
      classname: team_WOLF_checkpoint
      when_flags_any: [4, 8]
      when_flags_none: [1]

  - id: ETL_CHECKPOINT_HOLD_NOT_TOUCHED
    check: forbid
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_team.c:1463-1476 (CP_HOLD without SPAWNPOINT gives the flag a use function and no touch), :1118-1125 (nor after a capture)"
    message: >-
      {found} team_WOLF_checkpoint(s) set CP_HOLD (2) without SPAWNPOINT (1); touching the
      flag does nothing, and it changes hands only when another entity uses it
    fix_hint: "clear CP_HOLD (2); the gamepack calls it unused"
    params:
      classname: team_WOLF_checkpoint
      when_flags_all: [2]
      when_flags_none: [1]

  - id: ETL_CHECKPOINT_NO_TEAM_RAISES
    check: forbid
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_team.c:1243-1300 (each team's raise is skipped when the other team's ONLY bit is set)"
    message: >-
      {found} team_WOLF_checkpoint(s) set SPAWNPOINT with both AXIS_ONLY (4) and ALLIED_ONLY
      (8); no flag is ever raised, though captures still fire and switch the spawns
    fix_hint: "keep only the bit of the team that may raise the flag"
    params:
      classname: team_WOLF_checkpoint
      when_flags_all: [1, 4, 8]

  - id: ETL_SPAWN_REGION_OWNER
    check: flags_any
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_team.c:952-958 (owner from DEFAULT_AXIS / DEFAULT_ALLIES), :2466 (the region's team), :888-901 (alertentity swaps only an Axis or Allied owner)"
    message: >-
      {found} team_WOLF_objective spawn marker(s) set neither DEFAULT_AXIS (1) nor
      DEFAULT_ALLIES (2); no team can pick them in the limbo spawn list, and alertentity never
      hands them over
    fix_hint: "set spawnflags 1 for an Axis region or 2 for an Allied one"
    params:
      classname: team_WOLF_objective
      flags: [1, 2]

  # --- team-only doors: allowteams on a door (or anything a player uses) ---

  - id: ETL_ALLOWTEAMS_NAMES_A_TEAM
    check: key_pattern
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_spawn.c:814-831 (allowteams is lowercased and searched for 'axis', 'allies', 'cvops'; other words are ignored), game/g_utils.c:607-635 (no team bit lets everyone through; 'cvops' alone lets no team through)"
    message: >-
      allowteams names neither axis nor allies ({detail}); with no team in it the door opens
      for everyone, or with only cvops for no one
    fix_hint: "write the teams that may open it, as in \"axis\" or \"allies,cvops\" (not \"allied\")"
    params:
      key: allowteams
      pattern: "(?is).*(axis|allies).*"

  - id: ETL_TEAM_DOOR_OPENS_ON_TOUCH
    check: forbid
    severity: warning
    confidence: verified
    rule_source: "etlegacy game/g_mover.c:2242-2250 (a func_door with TOUCH and no targetname or health gets a touch trigger), :2110-2125 (which opens it through Use_BinaryMover; allowteams is checked only by G_TryDoor, :2337, and G_UseEntity, game/g_utils.c:649)"
    message: >-
      {found} func_door(s) with allowteams also set TOUCH (8); walking into one opens it for
      every team
    fix_hint: "clear TOUCH (8): players of the allowed teams open it with the use key"
    params:
      classname: func_door
      when_flags_all: [8]
      when_keys: [allowteams]
      when_keys_absent: [targetname, health]

# ---------------------------------------------------------------------------
# mapscript — maps/<map>.script, checked against the map by nrc_mcp.mapscript
# ---------------------------------------------------------------------------
#
# Every name below is read out of the engine. validate_profile parses the script found beside
# the .map and reports syntax the engine refuses, unknown events and actions, blocks no
# entity runs, and action arguments that name nothing.

mapscript:
  confidence: verified
  source: etlegacy_source
  locus: "game/g_script.c"
  # Beside the .map; under a game directory both live in maps/ (g_script.c:311-319). The
  # LMS variant <map>_lms.script is loaded instead in Last Man Standing and is not checked.
  file: "{map}.script"
  missing_severity: warning
  missing_note: "without one the map has no objectives, spawn changes or win conditions"
  # The entity key naming the block an entity runs (game/g_spawn.c:220, matched without
  # regard to case at g_script.c:423).
  block_key: scriptname
  # The one class the engine names itself: script_multiplayer is always game_manager.
  implied_names:
    - {classname: script_multiplayer, name: game_manager, locus: "game/g_script.c:1400"}
  # Actions whose arguments are a braced list rather than the rest of the line (g_script.c:491).
  brace_actions: [set, create, delete]
  # Of those, the one that spawns an entity from its key/value list (g_script_actions.c:5127).
  spawning_actions: [create]
  # How the engine's tokenizer reads the file (qcommon/q_shared.c COM_ParseExt): whitespace
  # is every byte <= ' ' read through a plain `char` (SkipWhitespace :515-530, a word ends at
  # `c > 32` failing :765-780), which is signed on the x86/x86_64 builds, so bytes 0x80-0xff
  # split words outside quotes too. Only '\n' is a line break (:524-528; a lone '\r' is just
  # whitespace), and the newlines inside a /* */ comment (:687-698) or a quoted string
  # (:706-763) are not seen, so an action's arguments run on past them. `\"` inside quotes is
  # a nested string (:713-745), and an empty "" token reads as the end of the script
  # (g_script.c:386, 452, 475; an action's arguments end at one, :522). Checked in etlded
  # 2.86.2 x86_64 with nrcroom: `wm_axis_respawntime<0xe9>10` loads (the byte separates), a
  # \r-only file, a "" or a quoted "}x" in a block another entity skips each stop the game,
  # and a line break inside /* */ leaves the next word an argument.
  tokenizer:
    high_bytes: whitespace
    locus: "qcommon/q_shared.c:515-530,643-787; game/g_script.c:380-623"
  # gScriptEvents, game/g_script.c:160-179. An unknown one stops the game (g_script.c:437).
  events:
    [spawn, trigger, pain, death, activate, stopcam, playerstart, built, buildstart, decayed,
     destroyed, rebirth, failed, dynamited, defused, mg42, message, exploded]
  # gScriptActions, game/g_script.c:52-150. An unknown one stops the game (g_script.c:483).
  actions:
    [gotomarker, playsound, playanim, wait, trigger, alertentity, togglespeaker,
     disablespeaker, enablespeaker, accum, globalaccum, print, faceangles, resetscript,
     attachtotag, halt, stopsound, entityscriptname, wm_axis_respawntime,
     wm_allied_respawntime, wm_number_of_objectives, wm_setwinner, wm_set_defending_team,
     wm_announce, wm_teamvoiceannounce, wm_addteamvoiceannounce, wm_removeteamvoiceannounce,
     wm_announce_icon, wm_endround, wm_set_round_timelimit, wm_voiceannounce,
     wm_objective_status, wm_set_main_objective, remove, setstate, followspline, followpath,
     abortmove, setspeed, setrotation, stoprotation, startanimation, attatchtotrain,
     freezeanimation, unfreezeanimation, remapshader, remapshaderflush, changemodel,
     setchargetimefactor, setdamagable, repairmg42, sethqstatus, printaccum, printglobalaccum,
     cvar, abortifwarmup, abortifnotsingleplayer, mu_start, mu_play, mu_stop, mu_queue,
     mu_fade, setdebuglevel, setposition, setautospawn, setmodelfrombrushmodel, fadeallsounds,
     construct, spawnrubble, setglobalfog, allowtankexit, allowtankenter, settankammo,
     addtankammo, kill, disablemessage, set, create, delete, constructible_class,
     constructible_chargebarreq, constructible_constructxpbonus, constructible_destructxpbonus,
     constructible_health, constructible_weaponclass, constructible_duration]
  # Entities that call a script event by label rather than naming an entity.
  entity_events:
    - classname: target_script_trigger
      label_key: target
      block_keys: [ainame, scriptname]
      event: trigger
      # It then fires its target as an entity name too (G_UseTargets, g_target.c:1310).
      also_targets: targetname
      severity: warning
      locus: "game/g_target.c:1276-1303 (ainame's block first, then its own scriptname's)"
  # Delayed actions belong to the entity running the event. Destruction can remove that
  # owner before a wait resumes; hand delayed work to a persistent manager instead.
  # FRAMETIME is 100ms, not the server's current frame duration. G_RunThink runs scripts
  # before think/removal, so short waits are timing-dependent and are only informational.
  lifetime:
    wait_locus: "game/g_script_actions.c:1651-1720 (wait, sv_fps quantization, sudden-death bypass); game/g_main.c:3908-3941 (scripts before think); game/g_script.c:632-654,840-855 (yielded self-trigger replaces caller)"
    fix_hint: "trigger a persistent game_manager event immediately, and put the wait and delayed actions in that event; triggering self keeps the same expiring owner"
    event_lifetimes:
      - classname: func_explosive
        events: [death, exploded]
        remove_after_ms: 100
        confidence: verified
        locus: "game/g_combat.c:2019 (death event); game/g_mover.c:4279-4305,4358 (BecomeExplosion/free and exploded event); qcommon/q_math.h:123 (FRAMETIME=100)"
    removal_actions:
      - action: remove
        remove_after_ms: 100
        confidence: verified
        locus: "game/g_script_actions.c:3952-3957 (remove schedules G_FreeEntity); qcommon/q_math.h:123 (FRAMETIME=100)"
    wait_actions:
      - {action: wait, duration_arg: 0, range_keyword: random, minimum_arg: 1, maximum_arg: 2}
    conditional_wait_actions:
      - {action: accum, args_equal: {1: wait_while_equal}}
      - {action: globalaccum, args_equal: {1: wait_while_equal}}
      - {action: cvar, args_equal: {1: wait_while_equal}}
      - {action: gotomarker}
      - {action: followspline}
      - {action: followpath}
      - {action: faceangles}
      - {action: playanim}
      - {action: halt}
    call_actions:
      - {action: trigger, target_arg: 0, label_arg: 1, event: trigger, self_names: [self]}
    uncertain_actions: [accum, globalaccum, cvar, abortifwarmup, abortifnotsingleplayer, resetscript, kill, delete, set, setstate, entityscriptname, gotomarker, followspline, followpath, faceangles, playanim, halt]
  # Action arguments that name something in the map.
  references:
    - action: trigger
      arg: 0
      resolves: block
      special: [self, global, player, activator]
      # `self` is the entity running the action, so its own block must have the event
      # (g_script_actions.c:1749-1755); the other specials reach entities not known here.
      self: [self]
      event: trigger
      event_label_arg: 1
      severity: warning
      describe: "a script block"
      consequence: "the game prints 'trigger has unknown name' and does nothing"
      locus: "game/g_script_actions.c:1727-1847"
    - action: alertentity
      arg: 0
      resolves: targetname
      severity: error
      describe: "an entity's targetname"
      consequence: "the game stops with 'alertentity cannot find targetname' when it runs"
      locus: "game/g_script_actions.c:2250-2262"
    - action: setstate
      arg: 0
      resolves: targetname
      severity: warning
      describe: "an entity's targetname"
      consequence: "nothing happens; the game says so only with g_scriptDebug or developer set"
      locus: "game/g_script_actions.c:4058-4073"
    - action: setautospawn
      arg: 0
      resolves:
        - {key: description, classname: team_WOLF_objective}
        - {key: message}
      severity: error
      describe: "a team_WOLF_objective description"
      case_insensitive: true   # G_Find compares with Q_stricmp, game/g_utils.c:345
      consequence: "the game stops with 'setautospawn, couldn't find target' when it runs"
      locus: "game/g_script_actions.c:176-210; description becomes message at game/g_team.c:942-946"
    - action: construct
      arg: 0
      resolves:
        - {key: targetname, classname: func_constructible}
      severity: error
      case_insensitive: true   # G_FindByTargetname compares with Q_stricmp, game/g_utils.c:509
      describe: "a func_constructible's targetname"
      consequence: "the game stops with '\"construct\" could not find entity' when it runs"
      locus: "game/g_script_actions.c:4275-4287"
    - action: wm_set_main_objective
      arg: 0
      resolves:
        - {key: target, classname: trigger_objective_info}
      severity: warning
      case_insensitive: true
      describe: "the target of a trigger_objective_info"
      consequence: "nothing happens: the objective is looked up by its trigger's target, and a miss is silent"
      locus: "game/g_script_actions.c:3358-3405"
      # Every stock map passes an objective number here, the old syntax, which the engine
      # ignores on purpose "for old map scripts compatibility" (g_script_actions.c:3372-3386).
      skip_numeric: true
    - action: followspline
      arg: 1
      resolves:
        - {key: targetname, classname: info_train_spline_main}
      severity: error
      case_insensitive: true   # BG_Find_Spline compares with Q_stricmp, game/bg_misc.c:3905-3919
      describe: "an info_train_spline_main's targetname"
      consequence: "the game stops with 'followspline: can't find spline' when it runs"
      locus: "game/g_script_actions.c:826-836"
      # `followspline accum <n> <name>` puts a buffer number here; that form is not checked.
      skip_numeric: true
  # Numeric arguments the engine refuses, with a G_Error, when the action runs.
  arg_ranges:
    - action: constructible_class
      arg: 0
      min: 1
      max: 3
      severity: error
      consequence: "the game stops with 'constructible_class has a bad value' when it runs"
      locus: "game/g_script_actions.c:4310-4315"
    # Found by a Tier 2 run: a model wrote `wm_number_of_objectives 0` for a map with none,
    # validate_profile passed it, and the server stopped on load. Each range below is the
    # engine's own test before its G_Error; the action names are g_script.c:74-85.
    - action: wm_number_of_objectives
      arg: 0
      min: 1
      max: 8   # MAX_OBJECTIVES (game/bg_public.h:229)
      severity: error
      consequence: "the game stops with 'Invalid number of objectives' when it runs"
      locus: "game/g_script_actions.c:3336-3340"
    - action: wm_objective_status
      arg: 0
      min: 1
      max: 8   # MAX_OBJECTIVES (game/bg_public.h:229)
      severity: error
      consequence: "the game stops with 'Invalid objective number' when it runs"
      locus: "game/g_script_actions.c:3427-3431"
    - action: wm_objective_status
      arg: 2
      min: 0
      max: 2
      severity: error
      consequence: "the game stops: status must be 0 (default), 1 (complete) or 2 (failed)"
      locus: "game/g_script_actions.c:3446-3449"
    - action: wm_setwinner
      arg: 0
      min: -1
      max: 1
      severity: error
      consequence: "the game stops with 'Invalid team number' when it runs"
      locus: "game/g_script_actions.c:3577-3581"
    - action: wm_set_defending_team
      arg: 0
      min: 0
      max: 1
      severity: error
      consequence: "the game stops with 'Invalid team number' when it runs"
      locus: "game/g_script_actions.c:3622-3626"
    - action: wm_voiceannounce
      arg: 0
      min: 0
      max: 1
      severity: error
      consequence: "the game stops with 'Invalid team number' when it runs"
      locus: "game/g_script_actions.c:3529-3533"
    - action: sethqstatus
      arg: 0
      min: 0
      max: 1
      severity: error
      consequence: "the game stops with 'sethqstatus with bad team set' when it runs (with a script_multiplayer)"
      locus: "game/g_script_actions.c:4180-4191"
  # Calls a running block should make. Not enforced by the engine, so never an error.
  required_actions:
    - block: game_manager
      event: spawn
      action: wm_setwinner
      severity: info
      consequence: >-
        at the time limit the winner is whatever wm_setwinner last set, and unset reads as 0,
        an Axis win (game/g_main.c:3549-3587)
      fix_hint: "call wm_setwinner with the defending team (0 Axis, 1 Allies) in game_manager's spawn"
  # Objective entities that need a key value, or a script action in their own block, to work.
  objective_requirements:
    - classname: func_explosive
      targeted_by: {classname: trigger_objective_info, key: target, flags_any: [1, 2]}
      # constructible_class 2/3 (or constructible_weaponclass 2/3 with no class) leaves a
      # weapon class of at least 1 after the engine's decrement (game/g_mover.c:4672-4689).
      key_min: {constructible_class: 2, constructible_weaponclass: 2}
      action: constructible_class
      action_min: 2
      severity: warning
      message: >-
        is a dynamite objective, but its weapon class stays below 1: dynamite can be planted and
        counts down, and the objective survives (game/g_missile.c:428, game/g_weapon.c:2072)
      fix_hint: "set constructible_class 3 on it, or call constructible_class 3 in its spawn event"


# ---------------------------------------------------------------------------
# sound - speaker scripts, sound scripts, and what in a map names them (nrc_mcp.soundscript)
# ---------------------------------------------------------------------------
# Two files, read by different parsers. Checked by validate_profile; packed by pack_pk3.
sound:
  confidence: verified
  source: etlegacy_source
  # A name ending in one of these is a sound file; any other name is a sound script's name
  # (cgame/cg_event.c:1983, cgame/cg_main.c:830). Files are loaded by exact name: the codec
  # adds no other extension (client/snd_codec.c:148-164).
  file_extensions: [wav, ogg]
  # A name starting with this is a per-player custom sound, not a file (cgame/cg_main.c:826).
  custom_prefix: "*"
  # The speaker script: the map's ambient speakers, placed with the in-game speaker editor.
  # Loaded by the server and the client alike (game/g_main.c:1854, cgame/cg_main.c:754) through
  # the bot-library tokenizer. A mistake prints an error and stops loading the file; the
  # speakers read before it stay. Nothing stops the game.
  speaker_script:
    path: "sound/maps/{map}.sps"
    root: speakerScript            # game/bg_sscript.c:333
    entry: speakerDef              # game/bg_sscript.c:353
    max_entries: 256               # MAX_SCRIPTSPEAKERS, game/bg_sscript.c:38
    sound_key: noise               # registered as a file (cgame/cg_main.c:759)
    name_key: targetname
    # Each key and the value the engine parses (game/bg_sscript.c:157-298).
    keys:
      noise: {type: string}
      origin: {type: vec3}
      targetname: {type: string, max_length: 31}   # char targetname[32], game/bg_public.h:2987
      looped: {type: enum, values: ["no", "on", "off"]}
      broadcast: {type: enum, values: ["no", global, nopvs]}
      wait: {type: int, min: 0}
      random: {type: int, min: 0}
      volume: {type: int, min: 0, max: 65535}
      range: {type: int, min: 0}
    locus: "game/bg_sscript.c:136-371"
  # Sound scripts: named groups of sound files. The client loads every file filelist.txt names
  # plus the map's own, and nothing else (cgame/cg_sound.c:396-468), so a name defined only in
  # another map's file does not resolve. A mistake here is CG_Error: the client stops.
  sound_scripts:
    directory: sound/scripts
    file_list: sound/scripts/filelist.txt
    map_file: "sound/scripts/{map}.sounds"
    sound_directive: sound         # cgame/cg_sound.c:404-424
    max_sounds_per_block: 16       # MAX_SOUNDSCRIPT_SOUNDS, cgame/cg_local.h:1044
    locus: "cgame/cg_sound.c:278-427"
  # Where a map names a sound file or a sound script.
  references:
    entity_keys:
      - {classname: target_speaker, key: noise, locus: "game/g_target.c:306-322"}
    # playsound: g_script_actions.c:1859-1909; the voice announcements: :3644-3784
    script_actions:
      - {action: playsound, arg: 0}
      - {action: wm_teamvoiceannounce, arg: 1}
      - {action: wm_addteamvoiceannounce, arg: 1}
      - {action: wm_removeteamvoiceannounce, arg: 1}
    # Script actions that name a speaker of the speaker script by its targetname. The engine
    # compares with Q_stricmp, and a name that matches nothing does nothing, silently
    # (game/g_script_actions.c:2301-2410).
    speaker_locus: "game/g_script_actions.c:2301-2410"
    speaker_actions:
      - {action: togglespeaker, arg: 0}
      - {action: disablespeaker, arg: 0}
      - {action: enablespeaker, arg: 0}


# ---------------------------------------------------------------------------
# sealing - what the compiler (q3map2 -game et) lets close the hull, for leak_trace
# ---------------------------------------------------------------------------
sealing:
  confidence: verified
  source: q3map2_source
  # A brush with any side whose shader carries one of these surfaceparms is translucent to the
  # compiler. The flags of all sides are OR-ed, so one such side makes the whole brush detail
  # and non-opaque (map.cpp:517-537), and a non-opaque brush never stops the outside flood.
  # The list is every C_TRANSLUCENT surfaceparm of the base game table (games.cpp:142-171) and
  # of the Wolfenstein table that et extends (games.cpp:361-387, :401).
  translucent_surfaceparms: [origin, areaportal, trans, alphashadow, lightfilter, trigger,
                             water, slime, lava, playerclip, monsterclip, nodrop,
                             clusterportal, donotenter, botclip, slag, clipmissile, clipshot,
                             donotenterlarge, ai_nosight, ai_nopass, ai_nopasslarge]
  # Model entities whose geometry the compiler bakes in: the clip brushes it builds from a
  # model are always detail (model.cpp:445, :489), so a model never seals, present or missing.
  model_entities: [misc_model]
  model_key: model


# ---------------------------------------------------------------------------
# engine - how to load a packed map in the game itself (nrc_mcp.engine, `mise run game:smoke`)
# ---------------------------------------------------------------------------
# Every line below was checked by loading maps in ET: Legacy v2.86.2 under Linux.
engine:
  confidence: verified
  source: etlegacy_source
  # Searched for in NRC_FS_BASEPATH, then on PATH. NRC_ENGINE_SERVER / NRC_ENGINE_CLIENT override.
  server: [etlded.x86_64, etlded.aarch64, etlded.i386, etlded, etlded.exe]
  client: [etl.x86_64, etl.aarch64, etl.i386, etl, etl.exe]
  # The home folder is ~/.etlegacy unless fs_homepath is set (qcommon/files.c:4525), and the
  # default dedicated 2 advertises the server to the public master servers - hence 1.
  server_args: ["+set", "dedicated", "1", "+set", "fs_homepath", "{home}", "+set", "fs_basepath", "{basepath}",
                "+set", "sv_pure", "0", "+set", "developer", "1", "+set", "logfile", "2", "+devmap", "{map}"]
  # The client hosts the map and joins it as a spectator, which is the step a map with no
  # intermission point crashes on (game/g_client.c:337-340). A listen server sends no heartbeat.
  client_args: ["+set", "fs_homepath", "{home}", "+set", "fs_basepath", "{basepath}", "+set", "sv_pure", "0",
                "+set", "developer", "1", "+set", "logfile", "2", "+set", "com_maxfps", "60",
                "+set", "r_mode", "-1", "+set", "r_customwidth", "800", "+set", "r_customheight", "600",
                "+set", "r_fullscreen", "0", "+set", "s_initsound", "0", "+set", "cl_allowDownload", "0",
                "+devmap", "{map}"]
  # A profile, so the client skips its first-run dialog (ui main.menu opens it while cl_profile
  # is empty; profiles/defaultprofile.dat sets it, qcommon/common.c:2997-3014).
  client_files:
    - {path: "legacy/profiles/defaultprofile.dat", text: "\"nrc\"\n"}
    - {path: "legacy/profiles/nrc/etconfig.cfg", text: "seta name \"nrc\"\n"}
  # logfile 2 writes here, under the mod directory (fs_game defaults to legacy).
  log: "legacy/etconsole.log"
  # Proof the map loaded.
  loaded: "Loaded entities from maps/{map}.bsp"
  client_connected: "Going from CS_PRIMED to CS_ACTIVE"
  # The game stopped: G_Error prints "ERROR: <message>" at the start of a line, then the server
  # shuts down "Server crashed". Harmless complaints ("^1ERROR: Can't find hunkusage.dat") carry
  # a timestamp and a colour code, so they never match.
  fatal: ["^ERROR: ", "Server crashed", "Received signal (4|6|8|11)\\b"]
  # Worth reading, never failing: the game's own non-fatal complaints about the map.
  noted: ["\\^1ERROR No ", "G_Script.*warning"]
  playtest:
    observer: etl-playtest.lua
    observer_target: legacy/nrc_playtest.lua
    screenshot_path: legacy/screenshots/{name}.jpg
    # Read-only game-side telemetry; client stdin carries normal controls.
    args: ["+set", "lua_modules", "nrc_playtest.lua", "+set", "g_doWarmup", "0",
           "+set", "g_warmup", "0", "+set", "g_teamForceBalance", "0",
           "+set", "g_inactivity", "0", "+set", "g_spectatorInactivity", "0",
           "+set", "net_ip", "127.0.0.1", "+set", "net_enabled", "1", "+set", "net_port", "0",
           "+set", "sv_maxclients", "1", "+set", "g_gametype", "2"]
    bootstrap: ["map_restart 0"]
    commands:
      join: "team {team} {role}"
      position: "setviewpos {x} {y} {z} {pitch} {yaw} {roll} 0"
      screenshot: "screenshotJPEG {name}"
      sync: "nrc_playtest_sync {sequence}"
      quit: quit
    # `aim` with `at` looks from the eye: the player's position raised by this player field
    # (ps.viewheight; the pliers trace starts there, g_weapon.c:2432-2434).
    eye_height: view_height
    teams: {red: axis, blue: allies}
    roles: {soldier: 0, medic: 1, engineer: 2, fieldops: 3, covertops: 4}
    weapons:
      pliers: {command: "weaponbank 5"}
      dynamite: {command: "weaponbank 6"}
      knife: {command: "weaponbank 1"}
    controls:
      attack: {press: "+attack", release: "-attack"}
      forward: {press: "+forward", release: "-forward"}
      back: {press: "+back", release: "-back"}
      left: {press: "+moveleft", release: "-moveleft"}
      right: {press: "+moveright", release: "-moveright"}
      crouch: {press: "+movedown", release: "-movedown"}
      prone: {press: "+prone", release: "-prone", mode: toggle,
              note: "Press toggles prone; releasing stops the button but does not stand up. Press again to leave prone where clearance permits."}
      jump: {press: "+moveup", release: "-moveup"}
      sprint: {press: "+sprint", release: "-sprint"}
      # The use key: doors (G_TryDoor checks allowteams), buttons, MG42s; client/cl_input.c:1497
      activate: {press: "+activate", release: "-activate"}
    fields:
      player: [connected, team, role, alive, health, stance, weapon, weapon_id, speed,
               position.0, position.1, position.2, angles.0, angles.1, angles.2,
               view_height, carrying]
      # charge_position: where a dynamite charge lies (the first one found).
      game: [phase, winner, charge_count, armed_charges,
             charge_position.0, charge_position.1, charge_position.2]
      entity: [present, seen, count, health, state, classname, progress, built,
               position.0, position.1, position.2]
    example:
      watch: [workshop_bridge]
      steps:
        - {action: join, team: blue, role: engineer, timeout: 40}
        - {action: position, origin: [928, 512, 24], angles: [55, 180, 0]}
        - {action: weapon, name: pliers}
        - action: hold
          controls: [attack]
          timeout: 45
          until: [{scope: entity, name: workshop_bridge, field: built, value: true}]
        - action: wait
          timeout: 10
          until: [{scope: game, field: phase, value: intermission}, {scope: game, field: winner, value: blue}]
        - {action: screenshot, name: victory}

# ---------------------------------------------------------------------------
# bots — Omni-bot waypoint files (bot_waypoints_write, bot_playtest)
# ---------------------------------------------------------------------------
# ET: Legacy loads Omni-bot as a shared library when omnibot_enable is 1, from the folder in
# omnibot_path (game/g_cvars.c:535-536; game/etbot/g_etbot_interface.cpp:5918-5944, which calls
# Omnibot_LoadLibrary with "omnibot_et" and that path; vendor/Omnibot/Common/BotLoadLibrary.cpp:
# 293-345 appends ".x86_64.so" on x86_64 Linux). The 2.86.2 release ships the add-on: the
# library (0.93) and its scripts and stock waypoints under legacy/omni-bot/, and the launch
# scripts etl_bot.x86_64.sh / etlded_bot.x86_64.sh set omnibot_enable 1 and
# omnibot_path ./legacy/omni-bot. Without those cvars no bot is ever loaded.
#
# The add-on reads waypoints through its own PhysFS file system, never through the game's pk3
# search path: it mounts <omnibot_path>/et (FileSystem.cpp:83-84; ET_Game.cpp:52-57 names the
# "et" sub folder), then archives inside et/nav and et/user/download onto nav/
# (IGameManager.cpp:84-85), and loads nav/<mapname>.way, loose files first
# (PathPlannerWaypoint.cpp:1144-1158). <mapname> is the game's level.rawmapname
# (g_etbot_interface.cpp:5725-5728). So a waypoint file packed into the map's pk3 is never
# read: it must be installed into the server's Omni-bot folder, et/nav/.
bots:
  confidence: verified
  source: omnibot_source
  addon: Omni-bot
  # Loaded in ET: Legacy 2.86.2 with the bundled 0.93 library and the 0.92 release library:
  # seeded files load ("N Waypoints Loaded"), bots walk them, take the CROUCH/PRONE stance in
  # flagged passages, and plant, defuse, build, capture, steal and escort on the dogfood maps
  # (bench/dogfood/README.md). On the traversal course (bench/dogfood/traversal.py) Axis bots
  # jumped the seeded ledge and gap (JUMP/JUMPLOW) and climbed the ladder (CLIMB) to plant the
  # radio. On the gates map (8 bots, 600 s, 0.93) Allies opened their
  # DOOR+ALLIES+TEAMONLY doorway and crossed it ~290 times between samples, Axis never; built
  # the bridge, crossed it, blew the wall and Axis then came through. Controls with a flag
  # stripped from the same file: without BLOCKWALL, Axis spent 165 of 262 samples pressed
  # against the wall before it went (13 of 242 with it); without BLOCKBRIDGE, all four Allies
  # fell into the trench before it was built (17 deaths; 4 with it, all one engineer walking
  # off-graph to the build goal's own position).
  engine_verified: [load, movement, stance_flags, objectives, jumps, ladders, doors, blockable_flags, bridge_flags]
  # Seen once, not isolated by a control: that the other team keeps out of a team doorway.
  engine_unverified: [door_team_flags]
  # Where the add-on looks, relative to omnibot_path; and where bot_waypoints_write stages
  # the file, relative to the folder holding maps/ (mirrors the omnibot_path layout, so the
  # staged tree can be copied over the server's Omni-bot folder). pack_pk3 never packs it.
  install_path: "et/nav/{map}.way"
  stage_dir: omni-bot
  # The install's own copy, used by bot_playtest as the template for an isolated add-on
  # folder ({basepath} = NRC_FS_BASEPATH). Never written to.
  install_dir: "{basepath}/legacy/omni-bot"
  format:
    codec: packed_waypoints
    # m_WaypointSerializer[9] is the newest serializer, so files are written as version 9
    # (PathPlannerWaypoint.cpp:95, :1310-1312); a version without a serializer fails with
    # "No Serializer for waypoint" (:1277-1279).
    version: 9
    # #pragma pack(1) { uchar version; uint num_waypoints; char timestamp[32];
    # char comments[232]; AABB world (6 floats) } = 293 bytes
    # (PathPlannerWaypoint.h:146-163, static assert :380). Little-endian, as written raw.
    header:
      timestamp_bytes: 32
      comment_bytes: 232
      comment: "seeded by nrc-mcp from the stance grids (cell {cell:g}, spacing {spacing:g})"
    # Per waypoint: a mask byte, the uid (varint) if not previous+1, 3 floats position, then
    # facing, flags (varint, 64-bit NavFlags), radius (byte or float), name, properties (each
    # varint-length string), then a varint connection count and one zigzag varint per
    # connection: the target's index minus this waypoint's (WaypointSerializer_V9.cpp:4-80,
    # :82-148; WaypointSerializer_V9.h:17-23 for the mask bits). Varints are 7 bits per byte,
    # low first, with the HIGH bit marking the last byte (FileSystem.cpp:632-643, :840-856,
    # zigzag :658-661 and :874-880). Connection flags are not stored in this version.
    mask: {flags: 1, name: 2, properties: 4, radius_int: 8, radius_float: 16, uid: 32, facing: 64}
    # Absent radius means 35 (WaypointSerializer_V9.cpp:36, :96).
    default_radius: 35
  # A waypoint's position is the player origin, 24 units above the floor: the waypoint
  # column runs from -24 to +40 around it (PathPlannerWaypoint.cpp:38-39) and GroundPosition
  # lifts a floor hit by 24 for a waypoint (:2067-2072). Matches the player box mins z -24.
  floor_offset: 24
  # Stock files connect waypoints a median 168-218 units apart (oasis, radar, battery).
  default_spacing: 128
  # NavFlags bits (NavigationFlags.h:9-33; ET_NavigationFlags.h for F_NAV_NEXT<<n = bit 32+n)
  # and their script names (IGame.cpp:602-631, ET_Game.cpp:553-583).
  flags:
    AXIS: 1            # TEAM1
    ALLIES: 2          # TEAM2
    TEAMONLY: 16
    CROUCH: 64
    DOOR: 128
    PRONE: 1048576     # 1<<20
    JUMPGAP: 256       # 1<<8, NavigationFlags.h:17; see jumps below for why it is not written
    CLIMB: 512         # 1<<9, NavigationFlags.h:18
    JUMPLOW: 262144    # 1<<18, NavigationFlags.h:27
    JUMP: 134217728    # 1<<27, NavigationFlags.h:36
    BLOCKWALL: 137438953472  # F_ET_NAV_WALL = F_NAV_NEXT<<5 = 1<<37
    BLOCKBRIDGE: 274877906944  # F_ET_NAV_BRIDGE = F_NAV_NEXT<<6 = 1<<38
  # A bot heading for a waypoint presses prone or crouch while that waypoint carries the flag
  # (BotBaseStates.cpp:744-747), and path costs weight such waypoints x3.8 / x3.2
  # (PathPlannerWaypoint.cpp:826-827). So the flag goes on every waypoint whose cells need the
  # stance: the bot crouches on the way in and stands once it heads for a standing waypoint
  # (the game keeps it ducked while the ceiling is too low).
  stance_flags:
    crouch: [CROUCH]
    prone: [PRONE]
  # A connection that only exists once a state-changing brush is gone (a blown wall): the
  # add-on traces a connection into a BLOCKWALL waypoint and closes it while the trace hits
  # solid (ET_Game.cpp:738-761), so the bots wait for the wall instead of running into it.
  blockable_flags: [BLOCKWALL]
  # Jumps the walk grids cannot make: up onto a ledge higher than a step, or across a gap.
  # Connection flags are not stored in the version-9 file, so the add-on learns of a jump
  # from WAYPOINT flags, read off the waypoint a bot is heading for (BotBaseStates.cpp:
  # 736-743): JUMP presses jump once the bot is within that waypoint's radius (:738-739);
  # JUMPLOW presses it (at most every 100 ms) while a box ray 48 units ahead, from 8 above
  # the feet (ET's step height for the add-on, ET_Client.cpp:80) to 16 higher, hits
  # something (:840-893); JUMPGAP traces down JumpGapOffset from the box centre and jumps
  # when the floor drops away (:905-950), but ET's JumpGapOffset is 0.32 units
  # (ET_Client.cpp:395-396), so that ray never reaches a floor and the flag never fires:
  # not written. Stock files put JUMP on a take-off waypoint with a small radius, linked
  # one way to a higher or farther waypoint (e.g. fueldump_christmas.way, radar_summer.way).
  #
  # So a jump is seeded as its own nodes: a run-up waypoint in line with the jump, a take-off
  # waypoint at the brink (takeoff_flags, `radius`), a ONE-WAY link to a landing waypoint
  # (landing_flags by kind, `radius`, so a bot below a ledge does not count it reached in
  # 2D), and walks between those and the ordinary waypoints of the two areas. Only the
  # take-off -> landing link needs the jump; nothing else leads through the take-off.
  #
  # Physics, all from the movement section: a jump gives jump_velocity up (bg_pmove.c:828)
  # under the effective gravity (750 with ET's fixed physics), so it rises v^2/2g = 48.6.
  # A ledge is linked when its top (measured exactly, not by cell) is at most
  # movement.jump_up_max (66: that rise plus the step-up a falling body pushing into the
  # riser gets at the apex, bg_slidemove.c:370-384; measured with a player holding forward,
  # bench/dogfood/movement_limits.py) minus `margin` above the take-off floor, and the
  # standing box sweeps clear straight up then across onto it: a bot that meets the riser
  # early slides up its face, and the add-on's JUMPLOW on the landing re-presses jump while
  # the riser is ahead. Pressing jump does not change horizontal speed (bg_pmove.c:782-831)
  # and air acceleration only adds speed toward the wish direction (pm_airaccelerate 1,
  # bg_pmove.c:88), so a gap is linked only when the standing box, swept along the
  # ballistic arc from every take-off point within the take-off radius, clears everything
  # and comes down with its centre over a walkable floor of the far area, at EVERY speed in
  # speed_scales x movement.run_speed: 0.4 = runSpeedScale 0.8 (g_client.c:3242) x 0.5 for
  # an unskilled heavy-weapon carrier (bg_pmove.c:673-695), 1.1 = sprintSpeedScale
  # (g_client.c:3243). Landings may be lower than the take-off only by the grids' safe drop.
  # `detour`: a jump is only added between two areas whose walking route in the seeded
  # graph is missing or longer than detour x the straight distance, so bots keep walking
  # where walking works. `tries`: candidate brinks tested per pair of areas.
  jumps:
    takeoff_flags: [JUMP]
    landing_flags: {ledge: [JUMPLOW], gap: []}
    radius: 16
    runup: 48
    margin: 4
    speed_scales: [0.4, 1.1]
    detour: 4
    tries: 8
  # Ladders: a brush face whose shader has surfaceparm ladder gets SURF_LADDER from q3map2
  # (games.cpp:180, the default table ET inherits), and a player whose box trace ahead
  # meets such a face climbs it (game/surfaceflags.h:76; PM_CheckLadderMove,
  # game/bg_pmove.c:4765-4855, climbing in PM_LadderMove :4860-4960). The base game's
  # common/ladder is ladder + playerclip, so the grids already treat it as solid. The add-on
  # climbs whenever the game says the bot is on a ladder (ENT_FLAG_ONLADDER from PMF_LADDER,
  # g_etbot_interface.cpp:3360-3362; BotBaseStates.cpp:752-808, pressing up toward a
  # higher next waypoint and down toward a lower one, ET uses this style: ET_Game.cpp:125).
  # CLIMB on a waypoint makes reaching it a 3D distance test (BotBaseStates.cpp:597) and
  # keeps the bot from looking around on the way (:1226); stock files flag both the foot and
  # the top of a ladder CLIMB and link them (e.g. es_alamo_sniper.way, reactor_final.way).
  # Seeded: a foot waypoint on the open side of the ladder, in front of its face, and a top
  # waypoint on the floor at the ladder's top (`top_window` below to `step_height` above),
  # linked both ways, when the standing box sweeps clear from the foot to the face, up the
  # face and across onto the top floor.
  ladders:
    surfaceparms: [ladder]
    flags: [CLIMB]
    top_window: 48
    reach: 64
  # Brushes whose state the seeding follows, beyond the profile's roles.state_changing
  # (blown walls). The graph is seeded over the map in every state at once, then gated:
  #   - a door a player opens with the use key is passable, with a waypoint in the doorway;
  #   - a wall or a door no player opens (locked, scripted, shot open) gets BLOCKWALL on
  #     connections through it;
  #   - floor only a built constructible gives (a bridge deck) gets BLOCKBRIDGE on
  #     connections across it, and is no floor at round start.
  doors:
    classnames: [func_door, func_door_rotating]
    # A bot presses the use key, 3 frames in 4, while heading for a DOOR waypoint
    # (BotBaseStates.cpp:615-616), and looks along its path instead of around
    # (BotBaseStates.cpp:1225-1226). The use key traces 96 units ahead of the eye
    # (game/g_cmds.c:4357-4380, CH_ACTIVATE_DIST bg_public.h:3162) and opens a door through
    # G_TryDoor (g_cmds.c:4172-4179); pressing it again while the door is open does nothing,
    # as the door stays active until it is shut (g_mover.c:2333-2337, :864-868). Stock files
    # put DOOR on the waypoints either side of a door (oasis 107/153, battery 56/458).
    flags: [DOOR]
    # allowteams (g_spawn.c:814-831), matched as the game does: lowercased, substring.
    # G_TryDoor refuses a team it does not name (g_mover.c:2337, g_utils.c:607-638). The
    # planner skips a TEAMONLY waypoint without the bot's team flag (PathPlannerWaypoint.cpp:
    # 805-807; team flags ET_Client.cpp:252-264), as stock team doors are flagged (oasis 107).
    team_key: allowteams
    team_flags: {axis: [AXIS, TEAMONLY], allies: [ALLIES, TEAMONLY]}
    # A func_door with TOUCH and no targetname opens for whoever walks into it, allowteams or
    # not (g_mover.c:2242-2250, :2110-2125): no team flags.
    touch: {classnames: [func_door], spawnflag: 8, unless_key: targetname}
    # Locked to the use key: a negative key (G_TryDoor refuses key < 0, g_mover.c:2337), or no
    # key and a targetname some entity other than these targets (key -2 becomes -1,
    # g_mover.c:2195-2233; SP_func_door sets -2 when the key is unset, :2455-2463). Only a
    # script or that entity opens it, so it is seeded as a wall: BLOCKWALL.
    key: key
    targeters_that_leave_it_open: [trigger_aidoor, func_invisible_user]
  # func_constructible starts unlinked unless START_BUILT (g_mover.c:5442-5480), so its brushes
  # are no floor and no wall at round start; built, they are solid. func_brushmodel holds the
  # stage models of a staged constructible and is freed on the fourth frame
  # (g_mover.c:5681-5697): its brushes count as built-only too.
  constructibles:
    classnames: [func_constructible]
    parts: [func_brushmodel]
    start_built: {key: spawnflags, bit: 1}
  # The add-on traces straight down from the middle of a connection whose two ends both carry
  # BLOCKBRIDGE, and closes it while the trace meets nothing within 48 units
  # (ET_Game.cpp:763-775), so a connection only gates the bridge when its midpoint is over
  # the deck. Stock files span a bridge with one connection between waypoints on the two
  # banks (battery 18-30, both BLOCKBRIDGE). Blockable links are re-tested every 2 s
  # (PathPlannerWaypoint.cpp:117, :437-460); stock map scripts also call Wp.CheckBlockable()
  # on a build (fueldump.gm Bridge_Built). The add-on sends a bot to the waypoint nearest a
  # goal, filtering closed waypoints but not closed links (PathPlannerWaypoint.cpp:1500-1515),
  # so no waypoint is seeded on a deck or inside a wall: they are spanned lip to lip.
  bridge_flags: [BLOCKBRIDGE]
  bridge_trace_depth: 48
  names:
    spawn: "{team} spawn"
    objective: "{label}"
    objective_keys: [track, scriptname, targetname, description]
  # The add-on's own log (omnibot_logsize > 0) goes to <omnibot_path>/et/logs/omnibot_<map>.log
  # when that folder exists (IGameManager.cpp:61-70), with "N Waypoints Loaded from file
  # nav/<map>.way" on success (PathPlannerWaypoint.cpp:1256) and these on failure.
  log: "et/logs/omnibot_{map}.log"
  loaded: "(\\d+) Waypoints Loaded from file nav/{map}\\.way"
  load_errors: ["Unable to Load Waypoint", "No Serializer for waypoint", "Waypoint {map}\\.way not found"]
  # Logging switched on in the isolated add-on folder's config (et/user/omni-bot.cfg, the
  # sample is et/user/omni-bot.txt): SleepBots 0 keeps bots thinking on a server no human
  # joined.
  config_path: et/user/omni-bot.cfg
  config: |
    [Log]
    LogInfo = true
    LogWarnings = true
    LogErrors = true
    LogCriticalErrors = true
    [ServerManager]
    SleepBots = 0
    SaveConfigChanges = 0
  # The add-on folder's parts bot_playtest copies (library and scripts); nav/ starts empty.
  copy: ["omnibot_et.x86_64.so", "omnibot_et.aarch64.so", "omnibot_et.so", "et/scripts", "global_scripts"]
  # A dedicated server with the add-on on, a read-only bot observer, and bots added by the
  # add-on's own console command ("bot maxbots N", the [ServerManager] MaxBots option).
  playtest:
    observer: etl-bots.lua
    observer_target: legacy/nrc_bots.lua
    args: ["+set", "omnibot_enable", "1", "+set", "omnibot_path", "{omnibot_path}",
           "+set", "omnibot_logsize", "2000", "+set", "lua_modules", "nrc_bots.lua",
           "+set", "g_gametype", "2", "+set", "g_doWarmup", "0", "+set", "g_warmup", "0",
           "+set", "timelimit", "0", "+set", "sv_maxclients", "16",
           "+set", "net_ip", "127.0.0.1", "+set", "net_port", "{port}"]
    after_map: ["+bot", "maxbots", "{bots}"]
    # Game log lines that mean an objective changed: popups for planted/defused dynamite and
    # stolen/returned flags (game/g_script.c:740-775), the map script's wm_announce texts
    # (g_script_actions.c:3835, :3869), a destroyed objective (g_missile.c:438) and the round
    # ending (g_main.c:3034, e.g. "Wolf EndRound." from wm_endround, g_script_actions.c:3888).
    events: [" popup: ", " announce: ", "Objective_Destroyed: ", "\\bExit: "]
    # The add-on's start-up line in the game log, naming its version.
    version_line: "Omni-bot (\\S+) initialized"
    # Written into the isolated add-on folder: the add-on runs scripts/et_autoexec_user.gm
    # after et_autoexec.gm (ET_Game.cpp:145-146), and DEBUG_MAP_SCRIPTS (false in
    # et_autoexec.gm:19) makes Util.MapDebugPrint print (global_scripts/utilities.gm:1647-1663),
    # so the map script's own messages reach the game log during a playtest only.
    user_script_path: et/scripts/et_autoexec_user.gm
    user_script: "global DEBUG_MAP_SCRIPTS = true;\n"
    # The goal file's count, from GoalManager::Load's summary (GoalManager.cpp:1059-1061),
    # printed to the game console: "^2N Goals Loaded, M Goals Deferred. ...".
    goals_loaded: "(\\d+) Goals Loaded, (\\d+) Goals Deferred"
    # Errors the add-on logs while loading the goal file or running the map script: its log
    # writes errors as "E <date> <message>" and warnings as "W ..." (a parse error is "error
    # (N) parse error" then "Could not parse file nav/<map>.gm"; a run-time error names
    # nav/<map>.gm(line)). A SetAvailableMapGoals name that matches no goal is a warning,
    # "goal query for X has no results" (GoalManager.cpp:1866-1868). Unknown goal types and
    # goals that fail to load go only to the game console (GoalManager.cpp:1028, :1059).
    # Seen in ET: Legacy 2.86.2 with Omni-bot 0.93 on deliberately broken files.
    script_errors: ["^E ", "^W .*has no results"]
    goal_errors: ["Unknown Goal Type", "Goals could not load", "Map Goals Script"]
    # Script messages: the map script's Util.MapDebugPrint lines start with this.
    script_marker: "nrc: "

  # ---- Map goals and the per-map script ------------------------------------------------
  # Besides nav/<map>.way, the add-on runs two scripts from the same folder at every map
  # load: nav/<map>_goals.gm, which must set the global table _MG of map goals with
  # Version = 1 (GoalManager.cpp:857, :909-1064; MapGoalVersion = 1, GoalManager.h:11), then
  # nav/<map>.gm, after which it calls the script's global OnMapLoad (IGame.cpp:1069-1112).
  # Both are loaded through the same file system as the .way (IGame.cpp:1089), so they are
  # staged and installed beside it, never packed. All 662 goal files shipped with 0.93
  # follow this layout. Every one of them, and 1338 of the 1339 shipped .gm files, compiles
  # with the GameMonkey core 0.93 embeds (gmscriptex, as 0.83/Omnibot/dependencies pins it).
  goals:
    install_path: "et/nav/{map}_goals.gm"
    table: _MG
    version: 1
    # A goal is named TYPE_tag: the loader takes the type from the name up to the first "_"
    # (GoalManager.cpp:976-980) and the tag from the rest (MapGoal.cpp:1714-1718). Generated
    # names keep to letters, digits and "_", as the add-on's own names do (MapGoal.cpp:290-302).
    name_chars: "[A-Za-z0-9_]"
    # Who may use a goal: TeamAvailability holds 1 << team (MapGoal.cpp:1750, default 30 =
    # every team). ET teams are AXIS 1, ALLIES 2 (vendor/Omnibot/ET/ET_Config.h:242-248,
    # Common/Omni-Bot_Types.h:217-226); scripts name them TEAM.AXIS and TEAM.ALLIES
    # (ET_Game.cpp:162-167). `side` is the spawn label of the same team (teams.sides).
    teams:
      axis: {side: red, bit: 2, script: TEAM.AXIS}
      allies: {side: blue, bit: 4, script: TEAM.ALLIES}
    # Position is the player origin (the stock files' goal heights sit 24 above the floor,
    # like waypoints; mapgoal_camp.gm upgrades only Version 0 goals by the waypoint offset).
    # The camp family (et/scripts/mapgoals/mapgoal_camp.gm:33-38, and defend/attack/snipe
    # built on it, global_scripts/mapgoals/mapgoal_defend.gm, mapgoal_attack.gm,
    # et/scripts/mapgoals/mapgoal_snipe.gm) reads AimVectors (facings), Stance
    # (stand/crouch/prone) and Min/MaxCampTime (seconds, defaults 20/40); SNIPE is limited to
    # sniper weapons (mapgoal_snipe.gm:7-19), MOBILEMG42 reads AimVectors and camp times
    # (mapgoal_mobilemg42.gm:30-33), MOBILEMORTAR needs at least one MortarAim
    # (mapgoal_mobilemortar.gm:11, :78-84). goal_camp.gm:6 is the bot goal that uses CAMP,
    # DEFEND, ATTACK and SNIPE.
    types:
      DEFEND: {aim: AimVectors, stance: true, camp_time: [20, 40]}
      ATTACK: {aim: AimVectors, stance: true, camp_time: [20, 40]}
      CAMP: {aim: AimVectors, stance: true, camp_time: [20, 40]}
      SNIPE: {aim: AimVectors, stance: true, camp_time: [60, 120]}
      MOBILEMG42: {aim: AimVectors, stance: false, camp_time: [30, 60]}
      MOBILEMORTAR: {aim: MortarAim, stance: false}
    stances: [stand, crouch, prone]
    comment: "written by nrc-mcp bot_waypoints_write"
    # Both scripts are GameMonkey, the add-on's script language. A vector is written with the
    # vec3 constructor the add-on's GameMonkey build registers (gmscriptex binds/gmVec3Stack);
    # shipped goal files write Vec3, older ones Vector3.
    vector: Vec3
    vector_names: [Vec3, Vector3]

  # The map script: one function per objective event, registered with OnTrigger. The game
  # hands the add-on a trigger with a tag name (Bot_Util_SendTrigger, etbot/
  # g_etbot_interface.cpp:6769-6779, which cuts it to TriggerBufferSize - 1 = 71 bytes,
  # Omni-Bot_Types.h:1160); a callback runs when its name equals the tag exactly
  # (TriggerManager.cpp:541-571, gmBotLibrary.cpp:149-171). SetAvailableMapGoals(team, on,
  # names) switches goals per team, team 0 meaning every team (gmBotLibrary.cpp:672-703,
  # MapGoal.cpp:332-345); a name is matched whole and case-insensitively
  # (Utilities.cpp:51-90).
  script:
    install_path: "et/nav/{map}.gm"
    trigger_bytes: 71
    # The two places a trigger name comes from:
    # - the game's own popups: "Planted at <track>." when dynamite is armed on an objective
    #   and "Defused at <track>." when it is defused, <track> being the objective trigger's
    #   track (game/g_script.c:761-773; the objective is `hit`, g_weapon.c:2112, whose parent
    #   is its trigger_objective_info, g_trigger.c:1677-1685);
    # - the map script's wm_announce text, sent as the trigger name (g_script_actions.c:3865).
    #   `announce` names an event of the map's own script; its first wm_announce (following
    #   `trigger <block> <label>` calls, as objectives.playtest.script.call says) is used, so
    #   a map whose author edited the text still matches. An event with no wm_announce is
    #   reported as not hooked.
    announce: {action: wm_announce, arg: 0}
    # The script's statements: the global table holding the event functions (stock scripts
    # call it Map), the global function the add-on calls after running the script
    # (IGame.cpp:1094-1101), the trigger registration and goal switch the add-on binds
    # (gmBotLibrary.cpp:2881, :2887), and the scripts' own debug print, which prints only
    # while map-script debugging is on (global_scripts/utilities.gm:1647-1663).
    map_table: Map
    on_load: OnMapLoad
    on_trigger: OnTrigger
    set_available: SetAvailableMapGoals
    debug_print: Util.MapDebugPrint
    # Per objective kind: `groups` are the spot sets made for it, each at one part of the
    # objective (a part of objectives.kinds.<kind>.playtest.find) for some teams (`owner` is
    # the objective's team, both teams for a neutral one; `other` the team that is not),
    # `initially` the teams it starts on for. `events` are what the script hooks, each with
    # the groups it switches on or off, for which teams (`all` = the group's teams).
    kinds:
      dynamite:
        groups:
          - {at: anchor, teams: [owner], initially: [owner]}
        events:
          - {name: planted, trigger: "Planted at {trigger.track}."}
          - {name: defused, trigger: "Defused at {trigger.track}."}
          - {name: destroyed, announce: {block: "{name}", event: death}, disable: [{group: anchor, teams: all}]}
      constructible:
        # Built, it is the builders' to keep; they defend it until it is blown up.
        groups:
          - {at: anchor, teams: [owner], initially: []}
        events:
          - {name: built, announce: {block: "{name}", event: built, params: [final]}, enable: [{group: anchor, teams: all}]}
          - {name: planted, trigger: "Planted at {trigger.track}."}
          - {name: defused, trigger: "Defused at {trigger.track}."}
          - {name: destroyed, announce: {block: "{name}", event: death}, disable: [{group: anchor, teams: all}]}
      command_post:
        groups:
          - {at: anchor, teams: [owner], initially: []}
        events:
          - {name: axis_built, announce: {block: "{name}_axis", event: built, params: [final]}, enable: [{group: anchor, teams: [axis]}]}
          - {name: axis_destroyed, announce: {block: "{name}_axis", event: death}, disable: [{group: anchor, teams: [axis]}]}
          - {name: allies_built, announce: {block: "{name}_allies", event: built, params: [final]}, enable: [{group: anchor, teams: [allies]}]}
          - {name: allies_destroyed, announce: {block: "{name}_allies", event: death}, disable: [{group: anchor, teams: [allies]}]}
      checkpoint:
        # Whoever holds the flag defends it.
        groups:
          - {at: anchor, teams: [axis, allies], initially: [owner]}
        events:
          - {name: axis_capture, announce: {block: "{name}", event: trigger, params: [axis_capture]},
             enable: [{group: anchor, teams: [axis]}], disable: [{group: anchor, teams: [allies]}]}
          - {name: allies_capture, announce: {block: "{name}", event: trigger, params: [allied_capture]},
             enable: [{group: anchor, teams: [allies]}], disable: [{group: anchor, teams: [axis]}]}
      checkpoint_one_way:
        groups:
          - {at: anchor, teams: [axis, allies], initially: [owner]}
        events:
          - {name: axis_capture, announce: {block: "{name}", event: trigger, params: [axis_capture]},
             enable: [{group: anchor, teams: [axis]}], disable: [{group: anchor, teams: [allies]}]}
          - {name: allies_capture, announce: {block: "{name}", event: trigger, params: [allied_capture]},
             enable: [{group: anchor, teams: [allies]}], disable: [{group: anchor, teams: [axis]}]}
      steal:
        # The owners guard the item; once it is stolen, the place it is delivered to.
        groups:
          - {at: anchor, teams: [owner], initially: [owner]}
          - {at: trigger, teams: [owner], initially: []}
        events:
          - {name: stolen, announce: {block: "{name}", event: trigger, params: [stolen]},
             enable: [{group: trigger, teams: all}], disable: [{group: anchor, teams: all}]}
          - {name: returned, announce: {block: "{name}", event: trigger, params: [returned]},
             enable: [{group: anchor, teams: all}], disable: [{group: trigger, teams: all}]}
          - {name: delivered, announce: {block: "{name}_deliver", event: death},
             disable: [{group: anchor, teams: all}, {group: trigger, teams: all}]}
      escort:
        # A vehicle moves along its whole path, so no fixed spot guards it: the script only
        # hooks its arrival (logged when map-script debugging is on).
        groups: []
        events:
          - {name: arrived, announce: {block: "{name}", event: trigger, params: [arrived]}}

  # How spots are chosen from the geometry. These are this server's heuristics, not the
  # add-on's rules: every spot sits on a seeded standing waypoint its team reaches from its
  # spawns, and its facing points at what it was chosen to watch.
  # - defend: per group and team, waypoints min..max_distance from the guarded part with a
  #   clear eye-height line to where the attackers use the objective (the waypoint nearest it
  #   that their spawns reach); ranked by how many waypoints of the attackers' shortest
  #   routes within approach_radius of it they see. Faces the mean of those it sees.
  # - snipe: per team, waypoints with no enemy route waypoint within standoff, ranked by how
  #   many enemy route waypoints they see between min_sight and max_sight (at least
  #   min_points). Enemy routes run from the enemy's spawns to every guarded part.
  # Chosen spots of a kind keep `separation` apart.
  spots:
    confidence: unverified
    source: heuristic
    defend: {type: DEFEND, per_group: 2, min_distance: 96, max_distance: 768, approach_radius: 1536}
    snipe: {type: SNIPE, per_team: 2, min_sight: 768, max_sight: 4096, min_points: 3, standoff: 384}
    separation: 192
    # Bounds on the line-of-sight work per map: candidates and route points beyond these are
    # thinned evenly.
    max_candidates: 400
    max_route_points: 160

# ---------------------------------------------------------------------------
# engine_limits — what decides whether the map LOADS, as opposed to compiles
# ---------------------------------------------------------------------------
#
# ET: Legacy's qfiles.h still carries MAX_MAP_* values, but its own comment says they size the
# utilities' buffers (qcommon/qfiles.h:986-987), and the engine's loaders allocate dynamically.
# The ceilings that do stop a map are the network and game ones below.
#
# `counts` names the field in bsp_report's `counts` to compare against.

engine_limits:
  models:
    value: 256
    counts: models
    confidence: verified
    source: >-
      etlegacy qcommon/q_shared.h:1253 MAX_MODELS. Every brush entity is one model and the
      configstring table is shared with other registered models, so real headroom is lower.
  entities:
    value: 1024
    counts: entities
    confidence: verified
    source: >-
      etlegacy qcommon/q_shared.h:1241-1242 MAX_GENTITIES. The absolute ceiling, before the
      64 client slots and everything the running game spawns - see unverified.entity_budget.
  brushes:
    value: 16384
    counts: brushes
    confidence: unverified
    source: "etlegacy qcommon/qfiles.h:990 MAX_MAP_BRUSHES - a utility buffer size, not an engine check"
  shaders:
    value: 1024
    counts: shaders
    confidence: unverified
    source: "etlegacy qcommon/qfiles.h:993 MAX_MAP_SHADERS - a utility buffer size, not an engine check"

# ---------------------------------------------------------------------------
# packaging — release conventions (ship_check reads these)
# ---------------------------------------------------------------------------

packaging:
  confidence: verified
  source: etlegacy_source
  basegame: etmain
  archive_extension: pk3
  # No prefix convention: released maps use plain names (goldrush, adlernest, supply).
  map_name_pattern: "^[a-z0-9_]+$"
  map_name_note: "lowercase, no prefix; see unverified.lowercase_map_names"
  map_name_confidence: unverified
  levelshot:
    directory: levelshots
    preferred_size: [256, 256]
    confidence: unverified
    note: "levelshots/<map>.tga is loaded at cgame/cg_debriefing.c:1055. Classic releases (adlernest, et_ice, braundorf_b4) ship 256x256; recent ETL remakes ship 1024x1024. Either loads."
  arena:
    directory: scripts
    extension: arena
    required_keys: [map, longname, type]
    confidence: unverified
    note: "scripts/<map>.arena is read at cgame/cg_missionbriefing.c:476; see unverified.arena_required_keys"
    # What arena_write may write. cgame reads map, longname, briefing, lmsbriefing,
    # alliedwintext, axiswintext and mapposition_x/y (cgame/cg_missionbriefing.c:260-417); the
    # UI reads map, longname, briefing, timelimit, the respawn times and type (ui/ui_gameinfo.c:101-215).
    keys: [map, longname, type, briefing, lmsbriefing, alliedwintext, axiswintext, timelimit,
           axisRespawnTime, alliedRespawnTime, mapposition_x, mapposition_y]
    # type lists the gametypes the map offers in the menu; these two are objective and stopwatch.
    defaults: {type: "wolfmp wolfsw"}
  # What objdata_write writes: limbo's map and objective descriptions (cgame/cg_main.c:521-629).
  objdata:
    path: "maps/{map}.objdata"
    teams: [axis, allied, neutral]
    description: 'wm_mapdescription {team} "{text}"'
    objective: 'wm_objective_{team}_desc {number} "{text}"'
    objective_teams: [axis, allied]
    max_objectives: 8          # MAX_OBJECTIVES, game/bg_public.h:229
    confidence: verified
  # What commandmap_make writes. The game frames levelshots/<map>_cc by the worldspawn's
  # mapcoordsmins (top-left: x min, y max) and mapcoordsmaxs (bottom-right), cgame/cg_spawn.c:555-586;
  # the area must be square (game/bg_tracemap.c:98-101). The shaders it draws are <map>_cc_trans
  # and _cc_automap (cgame/cg_commandmap.c:1572-1589), defined as the base game defines its own
  # in scripts/levelshots.shader, in a file of the map's own name so nothing is shadowed.
  commandmap:
    image: "levelshots/{map}_cc.tga"
    size: 512                  # every stock _cc.tga is 512x512, 24-bit
    mins_key: mapcoordsmins
    maxs_key: mapcoordsmaxs
    shader_file: "scripts/levelshots_{map}.shader"
    shader_text: |
      levelshots/{map}_cc_automap
      {{
      	nopicmip
      	nocompress
      	nomipmaps
      	{{
      		clampmap levelshots/{map}_cc.tga
      		depthFunc equal
      		rgbGen identity
      	}}
      }}

      levelshots/{map}_cc_trans
      {{
      	nopicmip
      	nocompress
      	nomipmaps
      	{{
      		clampmap levelshots/{map}_cc.tga
      		blendfunc blend
      		rgbGen identity
      		alphaGen vertex
      	}}
      }}
    confidence: verified
  # The other files a map is looked up by; ship_check reports any that are missing. An image
  # may ship under any extension the renderer tries (renderercommon/tr_common.c:45-53).
  companions:
    - {path: "maps/{map}.script", confidence: verified, role: map script, required: true, locus: "game/g_script.c:311-319"}
    - {path: "maps/{map}.objdata", confidence: verified, role: limbo objective descriptions, required: false, locus: "cgame/cg_main.c:532"}
    - {path: "levelshots/{map}_cc.tga", any_extension: [png, tga, jpg, jpeg], confidence: verified, role: command map, required: false, locus: "cgame/cg_main.c:1087"}
    - {path: "maps/{map}_tracemap.tga", confidence: verified, role: tracemap (written by generatetracemap), required: false, locus: "game/bg_tracemap.c:598"}
    - {path: "maps/{map}_loc.dat", confidence: verified, role: location names, required: false, locus: "cgame/cg_locations.c:526"}
    - {path: "levelshots/{map}.tga", any_extension: [png, tga, jpg, jpeg], confidence: verified, role: levelshot, required: false, locus: "cgame/cg_loadpanel.c:449"}
    - {path: "scripts/levelshots_{map}.shader", confidence: verified, role: command map shaders, required: false, locus: "cgame/cg_commandmap.c:1572-1589"}
    - {path: "sound/maps/{map}.sps", confidence: verified, role: speaker script, required: false, locus: "game/g_main.c:1854, cgame/cg_main.c:754"}
    - {path: "sound/scripts/{map}.sounds", confidence: verified, role: sound scripts, required: false, locus: "cgame/cg_sound.c:447"}
  # Resources the stock maps reference that the base game itself never shipped. pack_pk3 lets
  # each be missing, and says so, rather than failing the pack; anything else missing still
  # fails it. Each entry names where it is referenced and what the game does without it.
  allowed_missing:
    - path: sound/world/brickfall.wav
      confidence: verified
      referenced_by: "the shipped maps/oasis.bsp (pak0.pk3): a func_explosive's noise key"
      reason: >-
        no archive of the base game ships it; func_explosive registers its noise as the sound it
        plays on breaking (game/g_mover.c:4747-4758), and a sound that cannot be loaded
        registers as handle 0 (client/snd_dma.c:470-473), so in the original game too that wall
        breaks without a sound
    - path: sound/vo/fueldump/allies/hq_reptank.wav
      confidence: verified
      referenced_by: "pak0.pk3 sound/scripts/fueldump.sounds line 127, in a sound script a copy of it carries"
      reason: >-
        no archive of the base game ships it; a sound script's file that cannot be loaded
        registers as handle 0 (client/snd_dma.c:470-473) and plays nothing
    - path: sound/vo/fueldump/axis/hq_tanktunnel.wav
      confidence: verified
      referenced_by: "pak0.pk3 sound/scripts/fueldump.sounds line 235, in a sound script a copy of it carries"
      reason: >-
        no archive of the base game ships it (pak0.pk3 has hq_tanktunnels.wav); a sound that
        cannot be loaded registers as handle 0 (client/snd_dma.c:470-473) and plays nothing
    - path: sound/world/wolf.wav
      confidence: verified
      referenced_by: "pak0.pk3 sound/maps/radar.sps line 2091, in a speaker script a copy of it carries"
      reason: >-
        no archive of the base game ships it; the speaker registers it as handle 0
        (cgame/cg_main.c:759, client/snd_dma.c:470-473) and plays nothing
  reserved_shader_prefixes: [common/, sfx/, gfx/, models/]
  size_budget_bytes: 52428800
  size_budget_confidence: unverified
  size_budget_note: "50 MiB is a download-comfort norm, not a hard limit"

# ---------------------------------------------------------------------------
# assets — the Blender handoff's game-specific numbers (§5)
# ---------------------------------------------------------------------------

assets:
  confidence: verified
  source: gamepack_entities
  model_entity: misc_model
  model_key: model
  angles_key: angles
  scale_key: modelscale
  scale_vec_key: modelscale_vec
  lightmap_scale_key: _lightmapScale
  remap_key_prefix: _remap
  # model/modelscale/modelscale_vec are declared on misc_model by the gamepack; _lightmapScale
  # and _remap are q3map2's own keys, accepted on any model entity.
  # From the base game's common.shader. ET names its clips differently from Quake 3: `clip`
  # stops players only (nonsolid + playerclip), `clipshot` stops shots only, `clipfull` stops
  # both. `clipweap` has no nonsolid parm, so it is solid to everything, as its name does not say.
  clip_shaders:
    player: common/clip
    weapon: common/clipshot
    both: common/clipfull
    nodraw: common/nodraw
  clip_shaders_source: game_common_shader
  units:
    units_per_metre: 39.37
    up_axis: z
    forward_axis: x
    confidence: unverified
    source: "1 unit = 1 inch convention; the 72-unit player is 1.83 m at that scale"
  export:
    preferred_formats: [obj, ase, md3]
    default_format: obj
  budgets:
    prop_triangles: 900
    prop_materials: 2
    confidence: unverified
    note: "sensible defaults for a cover-sized prop, not a measured limit"
