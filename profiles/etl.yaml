# ---------------------------------------------------------------------------
# focus — the entities gameplay checks care about, and what the sources say of each
# ---------------------------------------------------------------------------

focus:
  - topic: "team spawns"
    classname: "team_CTF_redspawn"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Axis spawn point. Gamepack box \"-18 -18 -24 18 18 48\" is the real player box. Spawnflags INVULNERABLE (1) and STARTACTIVE (2). No keys: the team is the classname."
  - topic: "team spawns"
    classname: "team_CTF_bluespawn"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Allied spawn point; otherwise identical to team_CTF_redspawn."
  - topic: "team spawns"
    classname: "team_CTF_redplayer / team_CTF_blueplayer"
    present: false
    confidence: verified
    source: gamepack_entities
    absence_checked_in: [gamepack_entities]
    finding: "ABSENT. The Quake 3 initial-spawn classes do not exist in ET; there is no separate initial spawn entity."
  - topic: "spawn activation"
    classname: "team_CTF_redspawn"
    present: true
    confidence: verified
    source: etlegacy_source
    finding: "game/g_team.c:496 skips any team spawn without spawnflag 2 (STARTACTIVE) - a spawn without it is unusable until a script or checkpoint enables it. Selection then takes the active spawn closest to the chosen team_WOLF_objective (g_team.c:455 onward)."
  - topic: "spawn regions"
    classname: "team_WOLF_objective"
    present: true
    confidence: verified
    source: etlegacy_source
    finding: "Not an objective: a spawn-region marker shown in the limbo spawn list. Spawnflags DEFAULT_AXIS (1) / DEFAULT_ALLIES (2) give its starting owner (g_team.c:952-958). A team spawns at its active spawns nearest the selected marker, so markers are how spawns are grouped - there is no group key. With team spawns but no marker the game stops with \"No spawnpoints found\" (g_team.c:537); more than 16 stops it with MAX_MULTI_SPAWNTARGETS (q_shared.h:1262, g_team.c:915)."
  - topic: "objectives"
    classname: "trigger_objective_info"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "The objective's area and name. `track` is mandatory - the game stops without it (g_trigger.c:1818-1820). Targets the func_explosive or func_constructible it describes; spawnflags AXIS_OBJECTIVE (1) / ALLIED_OBJECTIVE (2) say who owns it. A brush trigger, so it is categorized trigger (non-solid), and counted as an objective through roles.objectives_also."
  - topic: "objectives"
    classname: "func_constructible"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Engineer-built objective. Spawnflags AXIS_CONSTRUCTIBLE (4) / ALLIED_CONSTRUCTIBLE (8) say who can build it. Stages are func_brushmodel entities named in constages/desstages."
  - topic: "objectives"
    classname: "func_explosive"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "A breakable. It is a dynamite objective only when a trigger_objective_info targets it, so it is categorized breakable and the objective is measured at that trigger instead."
  - topic: "objectives"
    classname: "team_WOLF_checkpoint"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Capturable flag. With SPAWNPOINT (1) it switches its targeted spawns to the capturing team (that team's on, the other's off) and runs trigger allied_capture / axis_capture in its script block (g_team.c:1216-1398). AXIS_ONLY (4) / ALLIED_ONLY (8) work only with SPAWNPOINT: the other team then lowers the flag instead of raising its own, and still runs its capture event and takes the spawns. Without SPAWNPOINT those bits are ignored, and CP_HOLD (2) leaves the flag untouchable (g_team.c:1463-1476). objective_place builds the stock pattern as checkpoint / checkpoint_one_way."
  - topic: "team-only doors"
    classname: "func_door_rotating"
    present: true
    confidence: verified
    source: etlegacy_source
    finding: "A door only some teams open is an ordinary door with the allowteams key (any entity accepts it, g_spawn.c:814-831): the stock maps use func_door_rotating with allowteams \"axis,cvops\" and type 5. Players open doors with the use key, which checks allowteams (G_TryDoor, g_mover.c:2337); others see the locked hint (g_main.c:886-907). A func_door with TOUCH (8) and no targetname opens for whoever walks into it, allowteams or not (g_mover.c:2110-2125, 2242-2250). A door some other entity targets is locked until that entity fires (key -1, g_mover.c:2224-2229)."
  - topic: "objectives"
    classname: "team_CTF_redflag"
    present: true
    confidence: verified
    source: gamepack_entities
