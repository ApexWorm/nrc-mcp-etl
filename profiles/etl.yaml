# profiles/etl.yaml
#
# ET: Legacy (Wolfenstein: Enemy Territory) entity ontology and engine facts. Data only - no
# code reads ET identifiers from anywhere but this file and corpus/.
#
# Two kinds of source, both listed under profile.sources:
#   - the NetRadiant-custom ET gamepack, for entity classnames, keys and spawnflags. The
#     entities: and enums: sections are a mechanical rendering of et_entities.ent; only the
#     `category` of each class is assigned by hand (it is a taxonomy, not gamepack data).
#   - the ET: Legacy source tree, for everything the gamepack does not state: player box,
#     movement constants, gametypes, engine limits, spawn selection, and the files a map
#     ships with. Every such entry cites file:line, relative to the tree's src/ directory.
#
# Unlike the Urban Terror gamepack, this one carries no measuring entities. A figure that is a
# literal constant in source, or exact arithmetic on such constants, is `verified`. A figure
# that depends on simulating movement (how high a jump reaches, how far a fall hurts) was
# measured in the engine instead (source engine_measurement: bench/dogfood/movement_limits.py,
# which re-runs it) and is `verified` with the lanes that show it under `engine_verified`.
#
# CONFIDENCE SEMANTICS (hard requirement, a validator depends on it):
#   verified    - the fact is literally present in one of the files listed under
#                 profile.sources, or is exact arithmetic on facts that are.
#                 Downstream validators may emit hard failures.
#   unverified  - believed true but NOT present in those files. Never a hard failure.
#
# `description` and `notes` are the gamepack's own wording, whitespace-collapsed. All of it is
# documentation, not validation input.

profile:
  id: etl
  game: "ET: Legacy"
  basegame: etmain
  engine_version: "2.86.2"
  radiant_build: "NetRadiant-custom-20260114"
  extracted: "2026-10-31"
  # Paths for gamepack_* are relative to the NetRadiant-custom install's gamepacks/
  # directory; etlegacy_source paths are relative to the source tree's src/ directory.
  sources:
    - id: gamepack_entities
      path: "et.game/etmain/et_entities.ent"
      radiant_build: "NetRadiant-custom-20260114"
      bytes: 95464
      sha256: "0939cec5d9b3372459e866ca1fe03e0de5362f7ad80be7177dbcbbe14c34102c"
      note: "installed gamepack; authoritative for classnames, keys and spawnflags"
    - id: gamepack_shaderlist
      path: "et.game/etmain/default_shaderlist.txt"
      radiant_build: "NetRadiant-custom-20260114"
      bytes: 1154
      sha256: "65f97654895bce38e495d959296620655423ea119be75c93fc85f4eaa2f68de1"
      note: "shader script list shipped with the gamepack"
    - id: gamepack_gamefile
      path: "games/et.game"
      radiant_build: "NetRadiant-custom-20260114"
      bytes: 779
      sha256: "53d74146d21d50368d4a65ac71d1e870f347aad6c23d60c3f57e2915f11de132"
      note: "editor game descriptor; source for basegame, engine names, asset types, q3map2 game"
    - id: gamepack_build_menu
      path: "et.game/default_build_menu.xml"
      radiant_build: "NetRadiant-custom-20260114"
      bytes: 3254
      note: "the editor's stock q3map2 command lines for this game"
    - id: etlegacy_source
      path: "etlegacy src/ (VERSION.txt: 2.86.2)"
      note: >-
        the engine and mod source. Cited as file:line; re-check the line numbers when this
        profile is re-extracted against a newer release.
    - id: game_common_shader
      path: "etmain/pak0.pk3:scripts/common.shader"
      bytes: 14977
      note: "the base game's common shaders, from an installed ET: Legacy; source for clip shader names"
    - id: q3map2_source
      path: "vendor/netradiant-custom tools/quake3/q3map2/"
      note: "the compiler this project drives; cited as file:line for what it does with a brush"
    - id: engine_measurement
      path: "bench/dogfood/movement_limits.py, scenario bench/dogfood/scenarios/movement_limits.json"
      note: >-
        one player driven through a hall of test lanes by engine_playtest, in ET: Legacy 2.86.2
        (client at com_maxfps 60, default g_fixedphysics 1 / g_fixedphysicsfps 125, g_gravity
        800, g_speed 320). The script asserts every recorded figure and re-runs in about two
        minutes. Measured 2026-11-06 in seven runs while the lanes were narrowed down; the
        checked-in lanes passed in both of their runs.
    - id: omnibot_source
      path: "github.com/jswigart/omni-bot, tag 0.93, directory 0.83/Omnibot/"
      note: >-
        the bot add-on's own source, matching the library the 2.86.2 install ships
        (legacy/omni-bot/omnibot_et.x86_64.so prints 0.93). Cited as file:line relative to
        0.83/Omnibot/. The serializer, header and flag files are byte-identical at tag 0.92,
        the version of the separate Linux release tarball. Not in the ET: Legacy tree, which
        vendors only the interface headers (vendor/Omnibot/Common, vendor/Omnibot/ET).
    - id: omnibot_release
      path: "<ET: Legacy 2.86.2>/legacy/omni-bot/et/nav/*.way (682 files) and omnibot-linux-latest.tar.gz omni-bot/et/nav/*.way (680)"
      note: >-
        shipped waypoint files, the format's reference data: every version-9 file in both
        (1360) reads and re-serializes byte-identically through the codec (tests pin a sample).

# Editor/engine facts from games/et.game (verbatim attribute values).
editor:
  confidence: verified
  source: gamepack_gamefile
  type: et
  name: "Wolfenstein: Enemy Territory"
  basegame: etmain
  basegamename: "Wolfenstein: Enemy Territory"
  prefix: ".etwolf"
  engine:
    win32: "ET.exe"
    linux: "et"
  enginepath:
    win32: "C:/Program Files (x86)/Wolfenstein - Enemy Territory/"
    linux: "/usr/local/games/enemy-territory/"
    macos: "/Applications/Wolfenstein ET/"
  note: >-
    The gamepack describes the original game. ET: Legacy installs as etl.exe / etl and
    keeps etmain as its base game; its own mod directory is `legacy`.
  shaderpath: scripts
  archivetypes: [pk3]
  texturetypes: [tga, jpg, png]
  maptypes: [mapq3]
  entityclasstype: [def, xml]
  common_shaders_dir: "common/"
  shader_trigger: "textures/common/trigger"
  # The `-game` value q3map2 is run with. Read by tools/q3map2.py when NRC_Q3MAP2_GAME is unset.
  q3map2_type: et

# The editor's stock compile lines, for reference. tools/q3map2.py has its own presets; these
# record what the gamepack author considered normal for this game.
build_menu:
  confidence: verified
  source: gamepack_build_menu
  bsp: "-meta -mv 1024 -mi 6144"
  vis: "-vis -saveprt"
  light: "-light -fast -samples 2 -filter -external -lightmapsize 256"
  note: >-
    -mv/-mi cap verts and indexes per meta surface; -external -lightmapsize 256 writes
    external 256x256 lightmaps, which every light build in the menu uses.

units:
  system: quake_units
  confidence: verified
  source: etlegacy_source
  note: >-
    The player is a box from playerMins to playerMaxs about its origin, and the origin is 24
    units above the floor. Heights below are measured from the floor.
  player:
    bounding_box:
      width_x: 36
      width_y: 36
      height_stand: 72
      confidence: verified
      source: etlegacy_source
      locus: "game/g_client.c:53-54 (playerMins -18 -18 -24, playerMaxs 18 18 48)"
    height_crouch:
      value: 48
      confidence: verified
      source: etlegacy_source
      locus: >-
        game/g_client.c:3240 crouchMaxZ = maxs[2] - (standViewHeight - crouchViewHeight)
        = 48 - (40 - 16) = 24, so the crouched box spans -24..24
    height_prone:
      value: 40
      confidence: verified
      source: etlegacy_source
      locus: "game/bg_pmove.c:1098 maxs[2] = PRONE_BODYHEIGHT_BBOX (bg_public.h:89, 16), so -24..16"
      note: "the prone body also has a separate legs box behind it; only the main box is recorded"
    eye_height:
      value: 64
      confidence: verified
      source: etlegacy_source
      locus: "bg_public.h:72 DEFAULT_VIEWHEIGHT 40, above an origin 24 units off the floor"

movement:
  confidence: verified
  source: etlegacy_source
  note: >-
    Literal constants from the movement code, and the figures that depend on how it
    integrates a jump or a fall, measured in the engine (engine_measurement). ET has no ledge
    grab or wall jump, so those entries are absent rather than zero. Stance analysis checks
    the main prone body box; separate leg collision and turning clearance are not modelled.
  step_height:
    value: 18
    description: "Max height a player can walk up without needing to jump."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_local.h:51 STEPSIZE"
    engine_verified: "movement_limits lanes `step 18` (walked up) and `step 19` (blocked)"
  headroom_stand:
    value: 72
    description: "Standing player height."
    confidence: verified
    source: etlegacy_source
    locus: "game/g_client.c:53-54"
  headroom_crouch:
    value: 48
    description: "Crouching player height."
    confidence: verified
    source: etlegacy_source
    locus: "game/g_client.c:3240"
  headroom_prone:
    value: 40
    description: "Prone player height (main box only)."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_pmove.c:1098, game/bg_public.h:89"
  floor_separation:
    value: 0.125
    description: >-
      Collision traces stop this far before entering a brush. On a flat floor the main body
      rests this far above the floor, so overhead clearance must include this separation.
    confidence: verified
    source: etlegacy_source
    locus: "qcommon/cm_local.h:184 SURFACE_CLIP_EPSILON; qcommon/cm_trace.c:685,751 (entering fraction backoff)"
  eye_height:
    value: 64
    description: "Standing eye height above the floor."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_public.h:72 DEFAULT_VIEWHEIGHT, plus the 24-unit origin offset"
  eye_height_crouch:
    value: 40
    description: "Crouching eye height above the floor."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_public.h:73 CROUCH_VIEWHEIGHT 16, plus 24"
  eye_height_prone:
    value: 16
    description: "Prone eye height above the floor."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_public.h:75 PRONE_VIEWHEIGHT -8, plus 24"
  jump_velocity:
    value: 270
    description: "Upward speed given by a jump, in units per second."
    confidence: verified
    source: etlegacy_source
    locus: "game/bg_local.h:53 JUMP_VELOCITY, applied at game/bg_pmove.c:828"
  jump_rise:
    value_approx: 48.5
    description: >-
      How far the feet rise in a standing jump: 270^2 / (2 x 750) = 48.6 under the effective
      gravity below, 48.4 in 16-17 ms frames, not the 45.56 that g_gravity 800 alone gives.
    confidence: verified
    source: engine_measurement
    locus: "game/bg_pmove.c:5380-5418 (fixed-physics velocity correction), game/g_cvars.c:636-637"
    engine_verified: >-
      movement_limits lane `jump`: highest sampled feet 48.04-48.55 above rest in six runs
      (samples every 100 ms, so up to about 0.5 below the apex); against a wall the samples
      reach 48.42
  jump_up_max:
    value: 66
    description: >-
      Highest ledge (brush top above the take-off floor) a standing jump lands on, holding
      forward into its face: the jump's rise plus the step-up a falling body gets at a riser.
      Stepping is refused while the body still rises (game/bg_slidemove.c:370-376), so at the
      apex the body steps STEPSIZE 18 higher (:384) and across: 48.4 + 0.125 + 18 = 66.56.
      Crouching does not raise it: a crouch lowers only the top of the box
      (game/bg_pmove.c:2036, :2069), and a player who stops pushing into the face before the
      apex does not step up at all.
    confidence: verified
    source: engine_measurement
    locus: "game/bg_slidemove.c:362-405 (PM_StepSlideMove), game/bg_pmove.c:1298 (air moves step)"
    engine_verified: >-
      movement_limits lanes `ledge 40` .. `ledge 68`: 66 climbed and 67 did not in every one
      of five runs (64 climbed in seven, 65 in six)
  fall_damage:
    confidence: verified
    source: engine_measurement
    note: >-
      PM_CrashLand (game/bg_pmove.c:1594-1628) solves the impact speed v within the landing
      frame and takes delta = v^2 * 0.0001; delta above 38.75, 48, 58, 67 and 77
      (bg_pmove.c:1674-1717) sends the events G_FallDamage turns into 10, 15, 25 and 50
      damage, and above 77 a gib (game/g_active.c:981-1014; GIB_DAMAGE, bg_public.h:59). Under
      the effective gravity 750 (gravity below) a fall from rest reaches those at drops of
      258.3, 320, 386.7, 446.7 and 513.3 units; the frame timing of each landing moves them by
      under a unit, so the heights on either side of a band edge (258, 320, 513) go either
      way. Drops are floor to floor (the body rests 0.125 above both). Standing water cuts
      delta to 0.5 or 0.25 and full submersion to none (bg_pmove.c:1631-1647); a
      SURF_NODAMAGE floor never hurts (:1659). Damage during the 3 s spawn shield is ignored
      (game/g_client.c:3322, game/g_combat.c:1601).
    engine_verified: >-
      movement_limits lanes `fall 256` .. `fall 514` (each walked off from a fresh spawn at
      100 health, after the spawn shield): every band below in four runs; 258 cost 10 in one
      run of three and 513 killed in one run of two
    thresholds:
      - {band: none, max_drop: 257, damage: 0, confidence: verified, source: engine_measurement,
         description: "Largest drop that costs no health (256 and 257 in every run; 258 hurt in one of three)."}
      - {band: light, min_drop: 259, max_drop: 319, damage: 10, confidence: verified, source: engine_measurement,
         description: "Costs 10 health (EV_FALL_DMG_10); 320 cost 10 in its one run."}
      - {band: medium, min_drop: 321, max_drop: 386, damage: 15, confidence: verified, source: engine_measurement,
         description: "Costs 15 health (EV_FALL_DMG_15)."}
      - {band: heavy, min_drop: 387, max_drop: 446, damage: 25, confidence: verified, source: engine_measurement,
         description: "Costs 25 health (EV_FALL_DMG_25)."}
      - {band: severe, min_drop: 447, max_drop: 512, damage: 50, confidence: verified, source: engine_measurement,
         description: "Costs 50 health (EV_FALL_DMG_50), so it kills a player left with 50 or less."}
      - {band: fatal, min_drop: 514, damage: gib, confidence: verified, source: engine_measurement,
         description: "A drop from this or higher gibs outright (EV_FALL_NDIE); 513 killed in one run of two."}
  gravity:
    default: 800
    effective: 750
    description: >-
      g_gravity is 800, but with g_fixedphysics on (the default, fps 125) each move adds back
      the velocity a 125 fps client loses to rounding: gravity x 8 ms = 6.4 rounds to 6, so
      0.4 per 8 ms, 50 units/s^2 whatever the frame time. Airborne bodies fall at 750, which
      is what jump_rise and the fall bands follow. A server that sets g_fixedphysics 0 rounds
      velocity to whole units each move instead (:5423), and those figures change with the
      frame rate; they were not measured that way.
    confidence: verified
    source: etlegacy_source
    locus: >-
      game/bg_public.h:55 DEFAULT_GRAVITY; g_gravity default at game/g_cvars.c:434;
      g_fixedphysics 1 and g_fixedphysicsfps 125 at game/g_cvars.c:636-637, the correction
      at game/bg_pmove.c:5380-5418 (instead of the velocity snap at :5423)
    engine_verified: "movement_limits lanes `jump` and `fall *` (both match 750, not 800)"
  run_speed:
    value: 320
    description: >-
      Default g_speed, in units per second; an input to idealized route-time estimates.
      Players move at a scale of it: running 0.8 (256), sprinting 1.1 (352), PM_CmdScale.
    confidence: verified
    source: etlegacy_source
    locus: "game/g_cvars.c:433; scales game/g_client.c:3242-3243, applied at game/bg_pmove.c:658-666"
    engine_verified: "movement_limits lanes `run` (256.0) and `sprint` (352.0)"

# Which shader contents stop a player, for patch collision in the movement analysis. The
# compiler's default table (shared by every game, and kept in code) already clears solid for
# nonsolid, water, trigger, playerclip and the rest; these are the Wolfenstein table's
# additions that ET inherits. `playerclip` stops players despite clearing solid.
collision:
  confidence: verified
  source: q3map2_source
  locus: "q3map2 games.cpp:361-387 (game_wolf surfaceParms, inherited by game_wolfet at games.cpp:400)"
  rule_source: "etlegacy game/bg_public.h:2056 MASK_PLAYERSOLID = SOLID | PLAYERCLIP | BODY; qcommon/cm_trace.c:876 skips a patch whose contents miss the mask"
  solid_clearing_surfaceparms: [slag, clipmissile, clipshot, donotenterlarge, ai_nosight, ai_nopass, ai_nopasslarge]

# Reinforcement analysis describes assumptions, not a replay of script execution. Server
# g_userAxisRespawnTime/g_userAlliedRespawnTime can override these script assignments.
balance:
  model: reinforcement_objectives
  confidence: verified
  source: etlegacy_source
  initial_spawn_flag: 2
  initial_spawn_locus: "game/g_team.c:496; entstate is checked at :502 too"
  startup_event: spawn
  respawn_actions:
    red: wm_axis_respawntime
    blue: wm_allied_respawntime
  respawn_action_locus: "game/g_script_actions.c:3260-3311; arguments in seconds"
  default_respawn_seconds: {red: 30, blue: 30}
  default_respawn_locus: "game/g_cvars.c:379-380; g_redlimbotime/g_bluelimbotime default 30000 ms"
  note: >-
    STARTACTIVE is a static initial-state hint. Scripts, checkpoints, entity states and server
    overrides can change available spawns and wave times. Explicit stage inputs describe those
    states; this analysis does not execute scripts or infer a whole mission's progression.

# ---------------------------------------------------------------------------
# gametypes
# ---------------------------------------------------------------------------
#
# ET gametypes are a server setting (g_gametype), not an entity filter: no entity in the
# gamepack carries a gametype key, so there is no gametype_key_syntax section and no
# per-gametype entity rule. Which gametypes a map supports is declared by the `type` key of its
# .arena file (see packaging.arena).

gametypes:
  - {id: 0, name: SP, label: "Single Player", team_mode: false, obsolete: true, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:453"}
  - {id: 1, name: COOP, label: "Cooperative", team_mode: false, obsolete: true, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:454"}
  - {id: 2, name: OBJ, label: "Objective", team_mode: true, arena_type: wolfmp, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:455 GT_WOLF"}
  - {id: 3, name: SW, label: "Stopwatch", team_mode: true, arena_type: wolfsw, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:456 GT_WOLF_STOPWATCH"}
  - {id: 4, name: CAMPAIGN, label: "Campaign", team_mode: true, arena_type: wolfmp, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:457 GT_WOLF_CAMPAIGN; the default, game/g_cvars.c:376"}
  - {id: 5, name: LMS, label: "Last Man Standing", team_mode: true, arena_type: wolflms, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:458 GT_WOLF_LMS"}
  - {id: 6, name: MAPVOTE, label: "Map Voting", team_mode: true, arena_type: wolfmp, confidence: verified, source: etlegacy_source, locus: "game/bg_public.h:459 GT_WOLF_MAPVOTE"}

# Sides. ET calls the teams Axis and Allies; the spawn classnames still say red and blue.
teams:
  confidence: verified
  source: etlegacy_source
  locus: "game/g_team.c:469 (TEAM_AXIS -> team_CTF_redspawn), :473 (TEAM_ALLIES -> team_CTF_bluespawn)"
  sides:
    - {label: red, name: Axis}
    - {label: blue, name: Allies}
  note: >-
    No ET spawn carries a team key. The team is in the classname for spawns, and in
    spawnflags for the classes below. func_constructible (AXIS/ALLIED_CONSTRUCTIBLE, 4/8) and
    team_WOLF_checkpoint (AXIS/ALLIED_ONLY, 4/8) are left out: their flags say who may build
    or capture, not who owns the thing.
  # Team by spawnflag. Read by Roles.team_of; the first flag set wins.
  spawnflags:
    team_WOLF_objective:     # DEFAULT_AXIS / DEFAULT_ALLIES, g_team.c:952-958
      - {flag: 1, label: red}
      - {flag: 2, label: blue}
    trigger_objective_info:  # AXIS_OBJECTIVE / ALLIED_OBJECTIVE: who owns it, gamepack
      - {flag: 1, label: red}
      - {flag: 2, label: blue}
    misc_commandmap_marker:  # ONLY_AXIS / ONLY_ALLIED, gamepack
      - {flag: 1, label: red}
      - {flag: 2, label: blue}

# ---------------------------------------------------------------------------
# objectives - recipes objective_place builds as one unit: entities, keys, script events
# ---------------------------------------------------------------------------
# Each kind lists the brush entities it creates (one per box the caller gives), their keys,
# and the script events written into the map script. {name}, {track} and {team} are the
# caller's; every other {placeholder} comes from team_values for that team. Built and loaded
# in ET: Legacy v2.86.2 before being listed here.
objectives:
  confidence: verified
  source: etlegacy_source
  teams: [axis, allies]
  kinds:
    dynamite:
      description: >-
        Something the other team blows up with dynamite: an objective trigger around a
        func_explosive. {team} owns and defends it.
      entities:
        - role: trigger
          classname: trigger_objective_info
          texture: common/trigger
          keys: {track: "{track}", shortname: "{track}", target: "{name}", spawnflags: "{owner_flag}"}
        - role: objective
          classname: func_explosive
          keys: {targetname: "{name}", scriptname: "{name}", constructible_class: "3"}
      script:
        - {block: "{name}", event: death, actions: ['wm_announce "{track} has been destroyed!"']}
      locus: >-
        game/g_trigger.c:1612-1678 (trigger links to its target), game/g_weapon.c:1980-2020
        (dynamite must sit in an enemy objective trigger), game/g_missile.c:395-447 (blows it up
        when its weapon class is at least 1; constructible_class 3 gives 2, g_mover.c:4672-4689)
      # The test objective_playtests generates: the other team's engineer stands in the trigger,
      # plants dynamite, arms it with pliers (aimed at the charge where it landed) and sees the
      # explosive freed. Pliers reach 64 units (CH_BREAKABLE_DIST, bg_public.h:3160) along the
      # view (g_weapon.c:2430-2545), so the charge is thrown steeply down to land within reach.
      playtest:
        find:
          anchor: {classname: func_explosive, name_key: targetname}
          parts:
            trigger: {classname: trigger_objective_info, key: target, value: "{name}"}
          team: {part: trigger, key: spawnflags, value: owner_flag}
        actor: {team: "{other}", role: engineer}
        watch: ["{name}"]
        proves: the other team's dynamite, armed in the trigger, destroys it
        steps:
          - {macro: stand, in: trigger, clear_of: anchor, face: anchor, pitch: 65, label: "stand in the objective trigger, facing it"}
          - {action: weapon, name: dynamite}
          - {action: hold, controls: [attack], seconds: 0.25, timeout: 5, label: "plant the dynamite"}
          - {action: wait, timeout: 5, label: "a charge lies in the world", until: [{scope: game, field: charge_count, op: gte, value: 1}]}
          - {action: aim, at: {scope: game, field: charge_position, offset: [0, 0, 4]}, label: "look at the charge"}
          - {action: weapon, name: pliers}
          - {action: hold, controls: [attack], timeout: 15, label: "arm it", until: [{scope: game, field: armed_charges, op: gte, value: 1}]}
          - {action: wait, timeout: 45, label: "the charge destroys the objective", until: [{scope: entity, name: "{name}", field: present, value: false}]}
          - {macro: round_end, events: [{block: "{anchor.scriptname}", event: death}]}
    constructible:
      description: >-
        Something {team}'s engineers build, and the other team can destroy with dynamite once
        built: an objective trigger around a func_constructible.
      entities:
        - role: trigger
          classname: trigger_objective_info
          texture: common/trigger
          keys: {track: "{track}", shortname: "{track}", target: "{name}", spawnflags: "{owner_flag}"}
        - role: objective
          classname: func_constructible
          keys: {targetname: "{name}", scriptname: "{name}", constructible_class: "3", spawnflags: "{builder_flag}"}
      script:
        - {block: "{name}", event: buildstart, params: [final], actions: []}
        - {block: "{name}", event: built, params: [final], actions: ['wm_announce "{track} has been constructed!"']}
        - {block: "{name}", event: decayed, params: [final], actions: []}
        - {block: "{name}", event: death, actions: ['wm_announce "{track} has been destroyed!"']}
      locus: >-
        game/g_mover.c:5614-5653 (team flag and constructible_class), game/g_trigger.c:1698-1706
        (trigger links to it), game/g_weapon.c:1068-1247 (buildstart/built events name a
        stage, here final), game/g_mover.c:5272-5313 (decayed)
      # The builder team's engineer stands in the trigger, clear of the brushes it builds (a
      # player inside them blocks construction), and holds pliers until it is built. Pliers
      # build the trigger the player touches whatever they aim at, g_weapon.c:2455-2542.
      playtest:
        find:
          anchor: {classname: func_constructible, name_key: targetname}
          parts:
            trigger: {classname: trigger_objective_info, key: target, value: "{name}"}
          team: {part: anchor, key: spawnflags, value: builder_flag}
        actor: {team: "{team}", role: engineer}
        watch: ["{name}"]
        proves: the builder team's engineer builds it with pliers
        steps:
          - {macro: stand, in: trigger, clear_of: anchor, face: anchor, pitch: 30, label: "stand in the objective trigger, clear of what it builds"}
          - {action: weapon, name: pliers}
          - {action: hold, controls: [attack], timeout: 60, label: "build it", until: [{scope: entity, name: "{name}", field: built, value: true}]}
          - {macro: round_end, events: [{block: "{anchor.scriptname}", event: built, params: [final]}]}
    # The stock command post (battery, goldrush, railgun: neutral; fueldump, oasis: one
    # team's). One objective trigger with the command-post icon targets one func_constructible
    # per team that may build it, under one targetname; the engine lets only one stand at a
    # time. Built, the scripts cut the team's charge times to 0.75 and turn on the HQ status
    # that reports enemy landmines; destroyed, they undo both. Destroyed by satchel or
    # dynamite: constructible_class 2, as the stock scripts set it.
    command_post:
      teams: [neutral, axis, allies]
      description: >-
        A command post: built, it shortens its team's charge times and reports nearby enemy
        landmines to it; destroyed, that stops. Neutral: either team builds it, one at a time.
      entities:
        - role: trigger
          classname: trigger_objective_info
          texture: common/trigger
          keys: {track: "{track}", shortname: "{track}", target: "{name}", spawnflags: "{command_post_flags}"}
        - role: objective
          teams: [neutral, axis]
          classname: func_constructible
          keys: {targetname: "{name}", scriptname: "{name}_axis", constructible_class: "2", spawnflags: "4"}
        - role: objective
          teams: [neutral, allies]
          classname: func_constructible
          keys: {targetname: "{name}", scriptname: "{name}_allies", constructible_class: "2", spawnflags: "8"}
      script:
        - {teams: [neutral, axis], block: "{name}_axis", event: buildstart, params: [final], actions: []}
        - teams: [neutral, axis]
          block: "{name}_axis"
          event: built
          params: [final]
          actions:
            - setchargetimefactor 0 soldier 0.75
            - setchargetimefactor 0 fieldops 0.75
            - setchargetimefactor 0 medic 0.75
            - setchargetimefactor 0 engineer 0.75
            - setchargetimefactor 0 covertops 0.75
            - sethqstatus 0 1
            - 'wm_announce "Axis Command Post constructed. Charge speed increased!"'
        - {teams: [neutral, axis], block: "{name}_axis", event: decayed, params: [final], actions: []}
        - teams: [neutral, axis]
          block: "{name}_axis"
          event: death
          actions:
            - setchargetimefactor 0 soldier 1
            - setchargetimefactor 0 fieldops 1
            - setchargetimefactor 0 medic 1
            - setchargetimefactor 0 engineer 1
            - setchargetimefactor 0 covertops 1
            - sethqstatus 0 0
            - 'wm_announce "Allied team has destroyed the Axis Command Post!"'
        - {teams: [neutral, allies], block: "{name}_allies", event: buildstart, params: [final], actions: []}
        - teams: [neutral, allies]
          block: "{name}_allies"
          event: built
          params: [final]
          actions:
            - setchargetimefactor 1 soldier 0.75
            - setchargetimefactor 1 fieldops 0.75
            - setchargetimefactor 1 medic 0.75
            - setchargetimefactor 1 engineer 0.75
            - setchargetimefactor 1 covertops 0.75
            - sethqstatus 1 1
            - 'wm_announce "Allied Command Post constructed. Charge speed increased!"'
        - {teams: [neutral, allies], block: "{name}_allies", event: decayed, params: [final], actions: []}
        - teams: [neutral, allies]
          block: "{name}_allies"
          event: death
          actions:
            - setchargetimefactor 1 soldier 1
            - setchargetimefactor 1 fieldops 1
            - setchargetimefactor 1 medic 1
            - setchargetimefactor 1 engineer 1
            - setchargetimefactor 1 covertops 1
            - sethqstatus 1 0
            - 'wm_announce "Axis team has destroyed the Allied Command Post!"'
      locus: >-
        game/g_trigger.c:1680-1719 (one trigger, a second func_constructible under the same
        targetname, never of the same team), game/g_weapon.c:1000-1018 (only one of the pair
        may be built or building), game/g_script_actions.c:992-1070 (setchargetimefactor:
        team 0/1, factor 0-1; 'lieutenant' is the deprecated spelling of fieldops),
        game/g_script_actions.c:4152-4192 and game/g_active.c:1621-1639 (sethqstatus: the team
        is told of enemy landmines near it), game/g_mover.c:5585-5589 (class 2: weapon class 1,
        satchel or dynamite); stock railgun_final.script, fueldump_final.script
      # A team that may build it (Allies for a neutral one) builds its own constructible. The
      # pair share a targetname, so the test watches the builder's by its scriptname.
      playtest:
        find:
          anchor: {classname: trigger_objective_info, name_key: target}
          parts:
            objective: {classname: func_constructible, key: targetname, value: "{name}",
                        flags: {key: spawnflags, value: builder_bit}}
          team: {part: anchor, key: spawnflags, value: command_post_flags}
        actor: {team: "{builder}", role: engineer}
        watch: ["{objective.scriptname}"]
        proves: an engineer of a team that may build it builds that team's command post
        steps:
          - {macro: stand, in: anchor, clear_of: objective, face: objective, pitch: 30, label: "stand in the command post's trigger"}
          - {action: weapon, name: pliers}
          - {action: hold, controls: [attack], timeout: 60, label: "build the command post", until: [{scope: entity, name: "{objective.scriptname}", field: built, value: true}]}
          - {macro: round_end, events: [{block: "{objective.scriptname}", event: built, params: [final]}]}
    # The stock forward spawn flag (oasis Old City, radar Forward Bunker). With SPAWNPOINT the
    # flag itself switches its targeted spawns: the capturing team's on, the other team's
    # off. The script keeps the spawn region marker's owner in step (alertentity on a
    # team_WOLF_objective swaps its team) and makes the flag the capturing team's default
    # spawn. accum 0 holds the owner, so touching your own flag changes nothing.
    checkpoint:
      description: >-
        A forward spawn flag both teams capture. {team} holds it and its spawns at the start;
        touching it hands the spawns and the spawn region to the toucher's team.
      entities:
        - role: flag
          point: true
          classname: team_WOLF_checkpoint
          keys: {targetname: "{name}", scriptname: "{name}", target: "{name}_spawns", spawnflags: "1"}
        - role: flag
          point: true
          classname: team_WOLF_objective
          keys: {targetname: "{name}_wobj", scriptname: "{name}_wobj", description: "{track}", spawnflags: "{owner_flag}"}
        - {role: spawns, point: true, optional: true, classname: "{team_spawn}", keys: {targetname: "{name}_spawns", spawnflags: "3"}}
        - {role: spawns, point: true, optional: true, classname: "{other_spawn}", keys: {targetname: "{name}_spawns", spawnflags: "1"}}
      script: &checkpoint_script
        - {block: "{name}", event: spawn, actions: ["accum 0 set {script_team}"]}
        - block: "{name}"
          event: trigger
          params: [axis_capture]
          actions:
            - accum 0 abort_if_equal 0
            - accum 0 set 0
            - 'wm_announce "Axis capture {track}!"'
            - alertentity {name}_wobj
            - 'setautospawn "{track}" 0'
        - block: "{name}"
          event: trigger
          params: [allied_capture]
          actions:
            - accum 0 abort_if_equal 1
            - accum 0 set 1
            - 'wm_announce "Allies capture {track}!"'
            - alertentity {name}_wobj
            - 'setautospawn "{track}" 1'
      links: &checkpoint_links
        spawns_targetname: "{name}_spawns"
        spawn_marker: "{name}_wobj"
        note: >-
          Spawns placed later join the flag with targetname {name}_spawns: the holder's with
          spawnflags 3 (active), the other team's with 1. Keep them nearer this flag than any
          other spawn region marker.
      locus: &checkpoint_locus >-
        game/g_team.c:1216-1398 (checkpoint_spawntouch: axis_capture / allied_capture, then the
        targeted spawns of the capturing team on and the other team's off), :1413-1420 (the
        scriptname is required), :888-901 (alertentity on the marker swaps its team),
        :952-958 (DEFAULT_AXIS / DEFAULT_ALLIES), :455-537 (spawns need STARTACTIVE and go
        nearest the marker); game/g_script_actions.c:176-217 (setautospawn finds the marker by
        description); stock oasis_final.script oldcityflag, radar_final.script roadbunker
      # Nothing on the flag itself is observable, so a capture is proved where it matters: the
      # attackers, made to respawn by switching team and back, reappear at the flag's spawns;
      # after the holders touch it again they reappear at their own.
      playtest:
        find:
          anchor: {classname: team_WOLF_checkpoint, name_key: targetname}
          parts:
            marker: {classname: team_WOLF_objective, key: targetname, value: "{name}_wobj"}
            spawns: {classname: ["{team_spawn}", "{other_spawn}"], key: targetname, value: "{name}_spawns",
                     many: true, optional: true}
          team: {part: marker, key: spawnflags, value: owner_flag}
        actor: {team: "{other}", role: engineer}
        proves: the other team captures it and spawns at its spawns; the holders take it back
        steps:
          - {macro: spawned_at, at: base, label: "the attackers start at their own spawns"}
          - {macro: walk_to, target: anchor, distance: 80, controls: [forward], seconds: 1.5, label: "the attackers touch the flag"}
          - {macro: spawned_at, at: spawns, label: "the capture handed the flag's spawns to the attackers"}
          - {action: join, team: "{team}", role: engineer}
          - {macro: walk_to, target: anchor, distance: 80, controls: [forward], seconds: 1.5, label: "the holders take the flag back"}
          - {macro: spawned_at, team: "{other}", at: base, label: "the attackers spawn at their own spawns again"}
    # SPAWNPOINT plus the AXIS_ONLY / ALLIED_ONLY bit of the team that does not hold it. Only
    # checkpoint_spawntouch reads those bits: the holder touching the raised flag lowers it
    # (WCP_ANIM_*_FALLING) rather than raising its own, and still runs its capture event and
    # switches the spawns back. A permanent capture needs the flag taken away by script.
    checkpoint_one_way:
      description: >-
        A forward spawn flag only the team that does not hold it can raise. {team} holds it and
        its spawns at the start; {team} touching the raised flag lowers it and takes the spawns
        back.
      entities:
        - role: flag
          point: true
          classname: team_WOLF_checkpoint
          keys: {targetname: "{name}", scriptname: "{name}", target: "{name}_spawns", spawnflags: "{one_way_flag}"}
        - role: flag
          point: true
          classname: team_WOLF_objective
          keys: {targetname: "{name}_wobj", scriptname: "{name}_wobj", description: "{track}", spawnflags: "{owner_flag}"}
        - {role: spawns, point: true, optional: true, classname: "{team_spawn}", keys: {targetname: "{name}_spawns", spawnflags: "3"}}
        - {role: spawns, point: true, optional: true, classname: "{other_spawn}", keys: {targetname: "{name}_spawns", spawnflags: "1"}}
      script: *checkpoint_script
      links: *checkpoint_links
      locus: *checkpoint_locus
      playtest:
        find:
          anchor: {classname: team_WOLF_checkpoint, name_key: targetname}
          parts:
            marker: {classname: team_WOLF_objective, key: targetname, value: "{name}_wobj"}
            spawns: {classname: ["{team_spawn}", "{other_spawn}"], key: targetname, value: "{name}_spawns",
                     many: true, optional: true}
          team: {part: anchor, key: spawnflags, value: one_way_flag}
        actor: {team: "{other}", role: engineer}
        proves: the holders cannot raise it; the other team captures it; the holders lower it and take the spawns back
        steps:
          - {action: join, team: "{team}", role: engineer}
          - {macro: walk_to, target: anchor, distance: 80, controls: [forward], seconds: 1.5, label: "the holders touch the flag they hold"}
          - {macro: spawned_at, team: "{other}", at: base, label: "it did not change hands: the attackers still spawn at their own spawns"}
          - {macro: walk_to, target: anchor, distance: 80, controls: [forward], seconds: 1.5, label: "the attackers raise the flag"}
          - {macro: spawned_at, at: spawns, label: "the capture handed the flag's spawns to the attackers"}
          - {action: join, team: "{team}", role: engineer}
          - {macro: walk_to, target: anchor, distance: 80, controls: [forward], seconds: 1.5, label: "the holders lower the flag"}
          - {macro: spawned_at, team: "{other}", at: base, label: "the attackers spawn at their own spawns again"}
    # A vehicle {team} escorts along a path made with path_place. Modelled on the goldrush and
    # fueldump tanks, minus their damage/repair: it moves while {team} players stand in the
    # escort volume and stops, at the next path point, a couple of seconds after they leave.
    escort:
      description: >-
        A vehicle {team} escorts along a path: a solid script_mover that follows the path
        (path_place) segment by segment while {team} players are in the escort volume around
        it, and stops at the next path point when they leave. `objective` is the vehicle as it
        stands at the path's first point, `trigger` the escort volume around it. Both turn to
        face along each segment. Not damageable. Ends with `trigger arrived` on {name}, which
        is the place for the win (script_set_event).
      # The path is a chain of path points; each segment is named by the point it leaves.
      path:
        # 196 events per block and actions per event (G_MAX_SCRIPT_STACK_ITEMS,
        # game/g_local.h:147; G_Error at game/g_script.c:440-443 and :583-586); the vehicle
        # block holds one event per segment plus ten.
        max_segments: 186
      options:
        speed:
          default: "64"
          pattern: "[1-9][0-9]*(\\.[0-9]+)?"   # 0 would divide by zero, g_script_actions.c:923
          description: "units per second along the path (followspline scales it by g_moverScale)"
        stop_after:
          default: "2"
          pattern: "[1-9][0-9]?"
          description: "seconds without an escort before the vehicle stops at its next path point"
      entities:
        - role: objective
          classname: script_mover
          # SOLID (2): players collide with it, and one it is pushed into is crushed
          # (script_mover_blocked, game/g_script.c:1082-1104).
          keys: {targetname: "{name}", scriptname: "{name}", spawnflags: "2"}
          origin_at: path_start
        - role: trigger
          classname: trigger_multiple
          texture: common/trigger
          keys: {scriptname: "{name}_escort", target: "{name}_enabler", spawnflags: "{escort_flag}", wait: "0.5"}
          origin_at: path_start
        - {role: enabler, point: true, at: trigger, classname: target_script_trigger,
           keys: {targetname: "{name}_enabler", scriptname: "{name}_enabler", target: run}}
        - {role: ticker, point: true, at: trigger, classname: func_timer,
           keys: {spawnflags: "1", wait: "1", target: "{name}_disabler"}}
        - {role: disabler, point: true, at: trigger, classname: target_script_trigger,
           keys: {targetname: "{name}_disabler", scriptname: "{name}_disabler", target: run}}
      # accum 0: next segment; 1: moving; 2: seconds since the last escort touch; 3: arrived.
      script:
        - {block: "{name}", event: spawn, actions: [accum 0 set 0, accum 1 set 0, accum 2 set 0, accum 3 set 0]}
        - {block: "{name}", event: trigger, params: [escort],
           actions: [accum 2 set 0, accum 1 abort_if_equal 1, accum 1 set 1, trigger self started, trigger self move]}
        - {block: "{name}", event: trigger, params: [tick], actions: [accum 2 inc 1]}
        - {block: "{name}", event: trigger, params: [move],
           actions: [trigger self stopcheck, accum 1 abort_if_equal 0, trigger self dispatch]}
        - {block: "{name}", event: trigger, params: [stopcheck],
           actions: ["accum 2 abort_if_less_than {stop_after}", accum 1 set 0, trigger self stopped]}
        - block: "{name}"
          event: trigger
          params: [dispatch]
          actions:
            - {each: segment, do: ["accum 0 trigger_if_equal {i} {name} run_{i}"]}
            - "accum 0 trigger_if_equal {segments} {name} arrive"
        - each: segment
          do:
            - {block: "{name}", event: trigger, params: ["run_{i}"],
               actions: ["trigger {name}_escort run_{i}", "followspline 0 {segment} {speed} wait", accum 0 inc 1, trigger self move]}
            - {block: "{name}_escort", event: trigger, params: ["run_{i}"], actions: ["followspline 0 {segment} {speed} wait"]}
        - {block: "{name}", event: trigger, params: [arrive], actions: [accum 3 abort_if_equal 1, accum 3 set 1, trigger self arrived]}
        - {block: "{name}", event: trigger, params: [started], actions: []}
        - {block: "{name}", event: trigger, params: [stopped], actions: []}
        - {block: "{name}", event: trigger, params: [arrived], actions: ['wm_announce "{track} has reached its destination!"']}
        - {block: "{name}_enabler", event: trigger, params: [run], actions: ["trigger {name} escort"]}
        - {block: "{name}_disabler", event: trigger, params: [run], actions: ["trigger {name} tick"]}
      locus: >-
        game/g_script_actions.c:722-913 (followspline moves along one spline segment, from the
        named point to its target; with wait the event resumes when it ends), game/bg_misc.c:3140-3215
        (the mover's origin follows the curve and its angles face along it), game/g_script.c:632-654
        (an event that finishes at once hands control back, so escort/tick never interrupt a
        move), game/g_trigger.c:80-125,155-200 (trigger_multiple team flags, wait),
        game/g_trigger.c:1180-1201 (func_timer START_ON), game/g_target.c:1276-1303
        (target_script_trigger runs trigger <target> in its block), q3map2 map.cpp:1640-1644 (the
        origin brush makes the brushes relative to the entity origin, which the spline moves)
      # The escort stands beside the vehicle, inside its escort volume, at one path point after
      # another, and waits for it to pass the next; once it stands back and checks that the
      # vehicle stops. The path, speed and stop delay are read from the vehicle's script.
      playtest:
        find:
          anchor: {classname: script_mover, name_key: targetname}
          parts:
            trigger: {classname: trigger_multiple, key: scriptname, value: "{name}_escort"}
          team: {part: trigger, key: spawnflags, value: escort_flag}
        actor: {team: "{team}", role: soldier}
        watch: ["{name}"]
        proves: the vehicle moves while escorted, stops without its escort, and reaches the end of its path
        steps:
          - macro: follow_path
            vehicle: anchor
            volume: trigger
            path: {block: "{anchor.scriptname}", event: trigger, params: [run_0], action: followspline, arg: 1}
            speed: {block: "{anchor.scriptname}", event: trigger, params: [run_0], action: followspline, arg: 2}
            stop_after: {block: "{anchor.scriptname}", event: trigger, params: [stopcheck], action: accum,
                         args_equal: {1: abort_if_less_than}, arg: 2}
            # Escort touches count every 0.5 s (wait) and the idle count rises once a second.
            stop_slack: 2
          - {macro: round_end, events: [{block: "{anchor.scriptname}", event: trigger, params: [arrived]}]}
    # Carriable documents and the place they are delivered: the radar parts, goldrush gold.
    steal:
      description: >-
        Something the other team steals from {team} and delivers: a carriable objective item
        ({carry_class}) and a delivery volume (trigger_flagonly_multiple) that takes it from the
        carrier and runs `death` on {name}_deliver. `objective` is where the item lies, as a
        point {"origin": [x, y, z]} or a box (its centre); the item falls to the floor below.
        `trigger` is the delivery volume. Events: stolen, dropped, returned, captured on {name}.
      options:
        model:
          default: models/multiplayer/secretdocs/secretdocs.md3
          pattern: "[A-Za-z0-9_/.-]+"
          description: "the model drawn where the item lies; the item itself has none"
      entities:
        - role: objective
          point: true
          classname: "{carry_class}"
          # No targetname: a targeted item spawns hidden and untouchable (g_items.c:1040-1047).
          keys: {scriptname: "{name}", message: "{track}", model: "{model}"}
        - role: trigger
          classname: trigger_flagonly_multiple
          texture: common/trigger
          keys: {scriptname: "{name}_deliver", spawnflags: "{carry_flag}"}
      script:
        - {block: "{name}", event: trigger, params: [stolen], actions: ['wm_announce "{track} has been stolen!"']}
        - {block: "{name}", event: trigger, params: [dropped], actions: ['wm_announce "{track} has been dropped!"']}
        - {block: "{name}", event: trigger, params: [returned], actions: ['wm_announce "{track} has been returned!"']}
        - {block: "{name}", event: trigger, params: [captured], actions: []}
        - {block: "{name}_deliver", event: death, actions: ['wm_announce "{track} has been delivered!"']}
      locus: >-
        game/g_team.c:375-406 (team_CTF_redflag belongs to Axis, blueflag to Allies; the other
        team picks it up, only while the game is playing), game/g_team.c:281-308 (trigger stolen),
        game/g_items.c:884-898 (trigger dropped), game/g_team.c:171-241 (trigger returned),
        game/g_trigger.c:1335-1395 (trigger_flagonly_multiple: RED_FLAG 1 / BLUE_FLAG 2 take it
        from the carrier, run death on the trigger and trigger captured on the item),
        game/g_items.c:991-994,1091-1094 (model is what is drawn; the item has no world model,
        game/bg_misc.c:2362-2410)
      # The thief walks onto the item, which only the other team can pick up while the game is
      # playing (g_team.c:375-406), and carries it into the delivery volume, which takes it from
      # the carrier (g_trigger.c:1335-1395).
      playtest:
        find:
          anchor: {classname: "{carry_class}", name_key: scriptname}
          parts:
            trigger: {classname: trigger_flagonly_multiple, key: scriptname, value: "{name}_deliver"}
        actor: {team: "{other}", role: covertops}
        proves: the other team picks it up and delivers it
        steps:
          - {macro: walk_to, target: anchor, distance: 80, controls: [forward], timeout: 6, label: "walk onto the item", until: [{scope: player, field: carrying, value: true}]}
          - {macro: walk_to, target: trigger, distance: 80, controls: [forward], timeout: 8, label: "carry it into the delivery volume", until: [{scope: player, field: carrying, value: false}, {scope: player, field: alive, value: true}]}
          - {macro: round_end, events: [{block: "{trigger.scriptname}", event: death}]}
  team_values:
    owner_flag: {axis: "1", allies: "2"}      # AXIS_OBJECTIVE / ALLIED_OBJECTIVE, g_local.h:2631-2632
    builder_flag: {axis: "4", allies: "8"}    # AXIS/ALLIED_CONSTRUCTIBLE, g_local.h:2637-2638
    script_team: {axis: "0", allies: "1"}     # the team number scripts use, g_script_actions.c:3560
    # IS_COMMANDPOST (64, gamepack; g_trigger.c:1802) plus the owner bit, g_local.h:2631-2632
    command_post_flags: {neutral: "64", axis: "65", allies: "66"}
    # The team's spawn class and the other team's, g_team.c:469-473
    team_spawn: {axis: team_CTF_redspawn, allies: team_CTF_bluespawn}
    other_spawn: {axis: team_CTF_bluespawn, allies: team_CTF_redspawn}
    # SPAWNPOINT (1) plus ALLIED_ONLY (8) when Axis hold it, AXIS_ONLY (4) when Allies do, g_team.c:963-966
    one_way_flag: {axis: "9", allies: "5"}
    escort_flag: {axis: "1", allies: "2"}     # trigger_multiple AXIS_ONLY / ALLIED_ONLY, g_trigger.c:165-180
    carry_class: {axis: team_CTF_redflag, allies: team_CTF_blueflag}   # g_team.c:385-392
    carry_flag: {axis: "1", allies: "2"}      # RED_FLAG / BLUE_FLAG on the delivery trigger, g_trigger.c:1234-1235
    # Who plays each objective's test (objectives.playtest): the other team, and who builds a
    # command post (Allies for a neutral one) with that team's constructible flag.
    other: {axis: allies, allies: axis}
    builder: {neutral: allies, axis: axis, allies: allies}
    builder_bit: {neutral: "8", axis: "4", allies: "8"}
  # Point a brush entity's brushes are relative to. The spline moves this point, so a mover
  # without one is carried off by its own world position (q3map2 map.cpp:1640-1644 adjusts
  # brushes only for an origin brush).
  origin_brush: {texture: common/origin, half_size: 8}
  # How objective_playtests turns each kind's `playtest:` template into engine_playtest steps.
  # A kind is recognised in any map by `find`: an `anchor` entity whose `name_key` names the
  # objective, `parts` linked to it by a key holding a value made from {name}, and `team`, the
  # team_values entry whose bits its spawnflags carry. An entity one kind claims is not offered
  # to the kinds after it in `order`.
  playtest:
    order: [command_post, checkpoint_one_way, checkpoint, constructible, dynamite, escort, steal]
    # A standing player's origin above the floor: playerMins z is -24, g_client.c:53-54.
    stand_height: 24
    spawns:
      classname: {red: team_CTF_redspawn, blue: team_CTF_bluespawn}   # g_team.c:469-473
      active: {key: spawnflags, bit: 2}                                # STARTACTIVE, g_team.c:496
    script:
      # Followed from an objective's events to see whether it ends the round, and for whom.
      call: {action: trigger, block_arg: 0, label_arg: 1, event: trigger, self_names: [self]}
      winner: {action: wm_setwinner, arg: 0, teams: {"0": red, "1": blue}}   # g_script_actions.c:3577-3600
      end_round: {action: wm_endround}                                       # g_script_actions.c:3487-3510
    # Classes that make up objectives: one that no kind recognises is reported as untested.
    classnames: [trigger_objective_info, func_explosive, func_constructible, team_WOLF_checkpoint,
                 team_CTF_redflag, team_CTF_blueflag, trigger_flagonly_multiple]

# ---------------------------------------------------------------------------
# spawn_cluster - what spawn_cluster writes for a group of team spawns and its region marker
# ---------------------------------------------------------------------------
# Teams are named by the labels in `teams.sides` (red/blue), or their names (Axis/Allies).
# Positions are found by the tool from the movement constants (player width, standing
# height, step) and the map's own collision brushes; nothing here is a position.
spawn_cluster:
  confidence: verified
  source: etlegacy_source
  spawn:
    classname: {red: team_CTF_redspawn, blue: team_CTF_bluespawn}
    classname_locus: "game/g_team.c:469 (TEAM_AXIS), :473 (TEAM_ALLIES)"
    # INVULNERABLE|STARTACTIVE. Selection skips a spawn without STARTACTIVE (2); the six
    # shipped maps set INVULNERABLE (1) on their team spawns too (corpus/real, e.g.
    # oasis_final.map "oldcityspawns"), so an inactive spawn keeps 1.
    spawnflags: {active: 3, inactive: 1}
    spawnflags_locus: "game/g_team.c:496 (skips spawns without flag 2); gamepack et_entities.ent INVULNERABLE/STARTACTIVE"
    # F_ANGLEHACK: a yaw in degrees.
    facing_key: angle
    facing_locus: "game/g_spawn.c:179"
    # The player box spans -24..48 about its origin, so an origin standing on a floor is 24
    # above it. The spawn drops to the floor itself (DropToFloor), but only from a start
    # outside solid (g_props.c:63-74), so the origin is written at standing height.
    origin_height: 24
    origin_height_locus: "game/g_client.c:53-54 playerMins z -24; game/g_team.c:824, :864 DropToFloor (g_props.c:63-85)"
    # A player standing on one spawn makes a neighbour within the player box "occupied":
    # SpotWouldTelefrag tests playerMins..playerMaxs about the spot. Spacing must exceed the
    # player width (units.player.bounding_box) so every spawn in a cluster stays usable.
    occupancy_locus: "game/g_client.c:230-251 SpotWouldTelefrag; game/g_team.c:508-516"
    # Script use toggles STARTACTIVE on every entity with this targetname: alertentity uses
    # each match (g_script_actions.c:2242-2290), Use_Team_Spawnpoint flips flag 2
    # (g_team.c:770-784, assigned at :819 and :859).
    group_keys: {targetname: "{group}"}
  marker:
    classname: team_WOLF_objective
    # DEFAULT_AXIS / DEFAULT_ALLIES: who owns the spawn region at the start.
    spawnflags: {red: 1, blue: 2}
    spawnflags_locus: "game/g_team.c:952-958"
    label_key: description
    label_locus: "game/g_team.c:942 (shown in the limbo spawn list)"
    # alertentity on the marker swaps its owner (team_wolf_objective_use, g_team.c:888-901,
    # assigned at :920). oasis_final.map's forward marker carries the same name as targetname
    # and scriptname ("old_city_wobj").
    group_keys: {targetname: "{group}_wobj", scriptname: "{group}_wobj"}
  # How a script toggles a group, for the caller to put in its own events. alertentity stops
  # the game when no entity has the name (g_script_actions.c:2262).
  toggle_action: "alertentity {name}"
  toggle_key: targetname   # G_FindByTargetnameFast, g_script_actions.c:2257
  toggle_locus: "game/g_script_actions.c:2242-2290"
  # A convention, not an engine rule: oasis_final.map's forward spawns sit 60-64 units apart.
  default_spacing: 64
  default_spacing_source: "corpus/real oasis_final.map entities 283-290"

# Paths movers follow, as path_place writes them: a chain of points, each naming the next, and
# optional control points that bend the segment leaving a point into a curve. Read by
# path_place and by objective_place for kinds that take a path.
paths:
  confidence: verified
  source: etlegacy_source
  point_class: info_train_spline_main
  control_class: info_train_spline_control
  name_key: targetname
  next_key: target
  # control, control2, control3, control4: read in that order until one is missing; a fifth
  # stops the map loading (MAX_SPLINE_CONTROLS, bg_public.h:2723; bg_misc.c:3961-3966).
  control_keys: [control, control2, control3, control4]
  case_sensitive: false     # BG_Find_Spline / BG_Find_PathCorner use Q_stricmp, bg_misc.c:3871-3922
  max_points: 512           # MAX_SPLINE_PATHS, bg_public.h:2722; Com_Error at bg_misc.c:3934-3937
  max_controls: 512         # MAX_PATH_CORNERS, bg_public.h:2673; shared with path_corner_2
  locus: >-
    game/g_mover.c:3128-3175 (info_train_spline_main: targetname, target, control keys; freed
    without a targetname), game/g_mover.c:3099-3126 (info_train_spline_control is spawned as
    path_corner_2 and needs a targetname), game/bg_misc.c:4016-4069 (points are linked by target
    after spawning; a missing target or control is only a console warning)

# What entity keys mean under a mirror (map_mirror). The brushes and patches are mirrored by the
# kernel; these say which keys are positions, facings and turning senses.
mirror:
  confidence: verified
  source: etlegacy_source
  # Keys whose value is a point "x y z", reflected with the geometry.
  point_keys: [origin]
  # A brush entity without an origin key turns about its origin brush (q3map2 map.cpp:1640-1644).
  origin_texture: common/origin
  # A yaw ("angle") is a facing the engine reads as angles 0 yaw 0 (g_spawn.c:179, :771-776);
  # -1 and -2 are not angles but "up" and "down" for movers (G_SetMovedir, g_utils.c:738-757).
  yaw_key: angle
  yaw_special: [-1, -2]
  # "pitch yaw roll" (g_spawn.c:178).
  angles_key: angles
  # Pairs of 2D corners "x y": the command map's top-left and bottom-right (g_spawn.c:979-980,
  # cg_spawn.c:555). Mirroring swaps which x belongs to which corner.
  corner_pairs: [[mapcoordsmins, mapcoordsmaxs]]
  # Classnames whose rotation sense a mirror reverses, by toggling `flag`, unless the entity
  # turns about the mirror axis itself (`axis_flags` names the flag that picks that axis).
  # func_door_rotating: REVERSE negates the turn; X_AXIS turns about x (rotate[2]), Y_AXIS
  # about y (rotate[0]), neither about z (g_local.h:2617-2620; g_mover.c:4062-4101).
  rotation_sense:
    func_door_rotating: {flag: 16, axis_flags: {x: 4, y: 8}}
  locus: >-
    game/g_spawn.c:178-179,768-776 (angles and angle both fill s.angles), game/g_utils.c:738-757,
    game/g_spawn.c:975-984, game/g_local.h:2617-2620, game/g_mover.c:4040-4110

# What a category cannot say. Read by analysis.roles.
roles:
  # An objective volume. Categorized `trigger` so its brushes are not collision, but it is
  # where the fighting is, so balance_report measures to it (from its brushes' centre).
  objectives_also: [trigger_objective_info]
  # The trigger is the accessible interaction area and carries objective ownership. Its
  # uniquely linked constructible is the same objective, not a second neutral destination.
  # Keep shared/multiple targets separate until their staged/team-specific states are modelled.
  objective_links:
    - classname: trigger_objective_info
      target_key: target
      target_name_key: targetname
      target_classnames: [func_constructible]
      case_sensitive: false
      confidence: verified
      source: etlegacy_source
      locus: "game/g_trigger.c:1680-1719 (constructible parent and optional second target); game/g_utils.c:475-509 (case-insensitive target lookup)"
  # No group key: a team spawns at its active spawns nearest the selected marker
  # (game/g_team.c:455 onward), so spawns are grouped by their nearest marker.
  spawn_groups:
    nearest: team_WOLF_objective
    label_key: description
  # Categories whose brushes can stop blocking during a round. A blown func_explosive is
  # freed outright: func_explosive_explode thinks BecomeExplosion, which ends in G_FreeEntity
  # (g_mover.c:4280-4289, 4310). spawns_reach_objectives walks with these open, so an
  # objective behind a door the attackers must blow still counts as reachable.
  # func_constructible is not listed: building one adds collision rather than removing it.
  state_changing: [breakable]

# ---------------------------------------------------------------------------
# ENUMS and ENTITIES
# Every classname defined in et_entities.ent (120), rendered mechanically, then the 40 classes
# the engine spawns that the gamepack omits. `kind`: point = point entity (editor box given);
# brush = owns brushes. Categories are this profile's taxonomy: `objective` covers only point
# and solid objectives - trigger_objective_info stays `trigger` so its volume is not mistaken
# for collision, and func_explosive stays `breakable` (see focus:).
# ---------------------------------------------------------------------------

key_blocks:
  # The keys every entity accepts: game/g_spawn.c's fields[] table (lines 153-243), which
  # G_ParseField matches for any classname without regard to case (g_spawn.c:749). The
  # gamepack lists few of them per class (team spawns list none), so without this block every
  # angle, targetname or scriptname would read as unknown. Read by profiles.declared_keys on
  # entity-tools, which adds an applies_to_all block to every entity.
  engine_fields:
    applies_to_all: true
    # G_ParseField compares with Q_stricmp, so "scriptname" is scriptName (g_spawn.c:749).
    case_insensitive: true
    confidence: verified
