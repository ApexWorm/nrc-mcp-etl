    source: gamepack_entities
    editor_box: "-8 -8 -8 8 8 8"   # xmin ymin zmin xmax ymax zmax
    description: "Portal camera. This camera is used to project its view onto a portal surface in the level through the intermediary of a misc_portal_surface entity. Use the \"angles\" key or target a target_position or info_notnull entity to set the camera's pointing direction."
    notes:   # prose sections of the gamepack entry, verbatim wording
