discrepancies:
  - id: objective_info_message_override
    claim: "(internal) The gamepack lists every trigger_objective_info spawnflag."
    verdict: contradicts   # supports | contradicts | silent
    checked_against: etlegacy_source
    locus: "game/g_trigger.c:1800, :1804, :1825-1828"
    evidence: "The source declares MESSAGE_OVERRIDE at value 4 (bit 2) and stops the game when it is set without override text. The gamepack's trigger_objective_info skips bit 2 entirely."
    action: "Do not treat bit 2 on trigger_objective_info as unknown. A spawnflag check, when one exists, should flag bit 2 without override text."
  - id: spawn_box_vs_engine_box
    claim: "The gamepack spawn box is the spawn's collision box."
    verdict: contradicts   # supports | contradicts | silent
    checked_against: etlegacy_source
    locus: "game/g_team.c:821-822, :861-862"
    evidence: "The gamepack draws team spawns as the player box (-18 -18 -24 18 18 48). The game gives the spawn entity itself the Quake 3 box (-16 -16 -24 16 16 32); the player that appears there uses playerMins/playerMaxs (g_client.c:53-54)."
    action: "Size clearance from the player box in units:, never from either spawn box."
  - id: info_player_start_missing
    claim: "The gamepack lists every classname the game spawns."
    verdict: contradicts   # supports | contradicts | silent
    checked_against: etlegacy_source
    locus: "game/g_spawn.c:439"
    evidence: "info_player_start is spawned by the game (as an alias of info_player_deathmatch) and is absent from et_entities.ent."
    action: "Listed under entities: with source etlegacy_source."

unverified:
  - id: arena_required_keys
    topic: packaging
    confidence: unverified
    source: none
    claim: "An .arena file needs map, longname and type."
    note: "The game reads those keys (ui/ui_gameinfo.c, game/g_utils.c:1637-1645 for type) but does not refuse an arena without them. Required in practice, for the map to appear in menus and vote lists."
  - id: lowercase_map_names
    topic: packaging
    confidence: unverified
    source: none
    claim: "Map names should be lowercase."
    note: "The game lowercases the map name when it looks for objdata and the tracemap (cgame/cg_main.c:532, game/bg_tracemap.c:598), so a mixed-case name can miss its own files on a case-sensitive filesystem. Not stated as a rule anywhere."
  - id: entity_budget
    topic: engine_limits
    confidence: unverified
    source: none
    claim: "A map has roughly MAX_GENTITIES minus clients and reserved slots for its own entities."
    note: "MAX_GENTITIES is 1024 (q_shared.h:1241-1242) and clients take the first 64 (q_shared.h:1239), but how many map entities survive spawning, and how many the running game needs for projectiles and bodies, is not a constant."

