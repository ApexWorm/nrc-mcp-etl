      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "The entity must be no farther than 64 units away from the portal surface to lock onto it. To make a mirror, apply the common/mirror shader to the surface, place this entity near it but don't target a misc_portal_camera."}
    keys:
      - {name: target, type: target, confidence: verified, source: gamepack_entities, editor_label: "Target", description: "point this to a misc_portal_camera that \"sees\" the view you want to display on the portal."}
